  root.style.cssText = `--s:${S}px;--h:${Hh}px;--cy:${cy}px;--tt:${Math.max(8, cy - Math.round(Hh / 2) - 104)}px;--rt:${cy + Math.round(Hh / 2) + 18}px;${avStyle(id)}`;
  const img = pose ? `<img class="ent-img" src="art/e${num}.webp" alt="" draggable="false">` : art ? `<img class="ent-img" src="art/${id}.webp" alt="" draggable="false">` : `<div class="ent-img disc">${AV_BY[id].em}</div>`;
  const tk = D.trail && D.trail[0], trail = !tk ? '' : tk === 'rainbow' ? '<div class="ent-trail rainbow"></div>' : tk === 'thr' ? '<div class="ent-thr"><i></i><i></i></div>'
    : '<div class="ent-trail speed"><i style="top:-6%;width:62%"></i><i style="top:27%;width:92%"></i><i style="top:60%;width:72%"></i></div>';
  root.innerHTML = `<div class="rays"></div><div class="ent-anchor"><div class="ent-fxl b"></div>
    <div class="ent-fig"><div class="ent-x"><div class="ent-sh"></div><div class="ent-y">${trail}<div class="ent-r">${img}${D.skates && !pose ? SKATES : ''}</div></div></div></div>
    <div class="ent-fxl f"></div></div>
    <div class="ent-title"><small>${esc(t('entHi'))}</small><b>${esc(pname())}!</b></div>
    <div class="ent-ribbon"><b>${esc(avName(id))}</b><small>${esc(say)}</small></div><div class="ent-skip">${esc(t('entSkip'))}</div>`;
  document.body.appendChild(root); entLive = root;
  const q = s => root.querySelector(s), anc = q('.ent-anchor'), fig = q('.ent-fig'), ex = q('.ent-x'), ey = q('.ent-y'), er = q('.ent-r'), sh = q('.ent-sh');
  const fxB = q('.ent-fxl.b'), fxF = q('.ent-fxl.f'), ttl = q('.ent-title'), rib = q('.ent-ribbon'), skip = q('.ent-skip'), rays = q('.rays'), trEl = q('.ent-trail,.ent-thr');
  const T0 = 140, anims = [], timers = [], st = { landed: false, fin: false, t0: Date.now() }, base = { duration: D.dur, delay: T0 };
  const later = (ms, fn) => { if (!manual) timers.push(setTimeout(fn, ms)); };
  const A = (el, frames, opt) => { const a = el.animate(frames, { fill: 'both', ...opt }); anims.push(a); return a; };
  const rowKF = (rows, mk, ezi) => {
    const ks = rows.map(r => ({ offset: Math.min(1, r[0] / D.dur), ...mk(r), easing: EZ[r[ezi] || 'L'] }));
    if (ks[0].offset > 0) ks.unshift({ ...ks[0], offset: 0 }); if (ks[ks.length - 1].offset < 1) ks.push({ ...ks[ks.length - 1], offset: 1 });
    return ks;
  };
  const cleanup = () => {
    timers.forEach(clearTimeout); root.remove(); if (entLive === root) entLive = null;
    if (hud) hud.style.visibility = '';
    if (!st.done) { st.done = true; if (o.done) o.done(); }
  };
  const FXL = { ring: 'b', glow: 'b', streak: 'b' };
  const fxSpawn = ([t, kind, x, y, sz, op = {}]) => {
    const size = Math.round(S * sz), hasArt = ART.has('fx_' + kind), el = document.createElement(hasArt ? 'img' : 'i');
    if (hasArt) { el.src = `art/fx_${kind}.webp`; el.className = 'fx'; el.draggable = false; el.alt = ''; } else { el.className = 'fx ' + kind; if (kind === 'excl') { el.textContent = '!'; el.style.fontSize = Math.round(size * .66) + 'px'; } }
    el.style.cssText += `width:${size}px;height:${size}px;margin:${-size / 2}px 0 0 ${-size / 2}px`;
    (FXL[kind] === 'b' ? fxB : fxF).appendChild(el);
    const dx = op.dx || 0, dy = op.dy || 0, s0 = op.s0 ?? .5, s1 = op.s1 ?? 1.4, r0 = op.r0 || 0, r1 = op.r1 ?? r0, sy = op.sy ?? 1, pk = op.o ?? .95, arc = op.arc || 0;
    const P = (px, py, sc, r) => `translate(${px.toFixed(2)}vw,${py.toFixed(2)}vh) rotate(${r}deg) scale(${sc},${+(sc * sy).toFixed(3)})`;
    const fr = arc
      ? [{ transform: P(x, y, s0, r0), opacity: 0, offset: 0, easing: 'cubic-bezier(.2,.7,.4,1)' }, { transform: P(x + dx * .5, y + dy * .5 - arc, (s0 + s1) / 2, (r0 + r1) / 2), opacity: pk, offset: .45, easing: 'cubic-bezier(.6,0,.85,.4)' }, { transform: P(x + dx, y + dy, s1, r1), opacity: 0, offset: 1 }]
      : [{ transform: P(x, y, s0, r0), opacity: 0, offset: 0, easing: 'cubic-bezier(.2,.7,.3,1)' }, { transform: P(x + dx * .4, y + dy * .4, (s0 + s1) / 2, (r0 + r1) / 2), opacity: pk, offset: .22, easing: 'cubic-bezier(.2,.7,.3,1)' }, { transform: P(x + dx, y + dy, s1, r1), opacity: 0, offset: 1 }];
    A(el, fr, { duration: op.d || 600, delay: T0 + t });
  };
  try {
    A(root, [{ opacity: 0 }, { opacity: 1 }], { duration: 220 });
    A(ex, rowKF(D.x, r => ({ transform: `translateX(${r[1]}vw)` }), 2), base);
    A(ey, rowKF(D.y, r => ({ transform: `translateY(${r[1]}vh) scale(${r[2]},${r[3]})` }), 4), base);
    A(er, rowKF(D.r, r => ({ transform: `perspective(900px) rotate(${r[1]}deg) rotateY(${r[2]}deg)` }), 3), base);
    A(sh, rowKF(D.y, r => { const up = Math.max(0, -r[1]); return { transform: `scale(${(1 - Math.min(.5, up / 30)).toFixed(3)})`, opacity: +(1 - Math.min(1, up / 22)).toFixed(3) }; }, 4), base);
    A(rays, [{ opacity: 0, transform: 'rotate(0deg)' }, { opacity: .42, transform: 'rotate(8deg)', offset: .12 }, { opacity: .42, transform: 'rotate(60deg)' }], { duration: D.dur + 3200, easing: 'linear' });
    if (trEl) {
      const [, a, b, c] = D.trail, d = D.dur, kf = [{ opacity: a ? 0 : 1, offset: 0 }];
      if (a) kf.push({ opacity: 1, offset: Math.min(1, (a + 60) / d) });
      kf.push({ opacity: 1, offset: b / d }, { opacity: 0, offset: Math.min(1, c / d) }); A(trEl, kf, base);
      if (tk === 'thr') trEl.querySelectorAll('i').forEach(f => A(f, [{ transform: 'scaleY(.78)' }, { transform: 'scaleY(1.25)' }], { duration: 90, iterations: 12, direction: 'alternate', delay: T0 }));
    }
    (D.shake || []).forEach(ms => A(anc, [{ transform: 'translate(0,0)' }, { transform: 'translate(-5px,4px)' }, { transform: 'translate(4px,-3px)' }, { transform: 'translate(-2px,1px)' }, { transform: 'translate(0,0)' }], { duration: 220, delay: T0 + ms - 20 }));
    if (!reduce) D.fx(ms => rowAt(D.x, ms), G).forEach(fxSpawn);
    if (!reduce) D.snd.forEach(([ms, fn]) => later(T0 + ms, () => { try { Sound[fn](); } catch (_) {} }));
    A(skip, [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 900 });
  } catch (e) { cleanup(); return null; }
  if (hud) hud.style.visibility = 'hidden';
  const pop = (el, d) => A(el, [{ opacity: 0, transform: 'scale(.5) translateY(16px)' }, { opacity: 1, transform: 'scale(1.08) translateY(0)', offset: .6 }, { opacity: 1, transform: 'scale(1) translateY(0)' }], { duration: 420, delay: d, easing: 'cubic-bezier(.3,1.4,.5,1)' });
  const finish = () => {
    if (st.fin) return; st.fin = true; timers.forEach(clearTimeout);
    anims.forEach(a => { try { if (a.effect.getTiming().iterations !== Infinity) a.finish(); } catch (_) {} });
    const fade = (el, d) => el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: d, fill: 'forwards' });
    [ttl, rib, skip].forEach(el => fade(el, 220)); fxB.remove(); fxF.remove(); fade(sh, 200);
    if (!hud || reduce) { const a = fade(root, 280); a.onfinish = cleanup; return; }
    const fr = fig.getBoundingClientRect(), hr = hud.getBoundingClientRect();
    const dx = hr.left + hr.width / 2 - (fr.left + fr.width / 2), dy = hr.top + hr.height / 2 - (fr.top + fr.height / 2), sc = Math.max(.04, pose ? hr.height / fr.height : hr.width / fr.width);
    if (o.onFly) o.onFly();
    fade(rays, 360);
    const f = fig.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${dx * .5}px,${dy * .5 - 36}px) scale(${Math.sqrt(sc).toFixed(3)})`, opacity: 1, offset: .5 },
      { transform: `translate(${dx}px,${dy}px) scale(${sc})`, opacity: pose ? 0 : 1 }], { duration: 560, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' });
    f.onfinish = () => {
      hud.style.visibility = ''; hud.animate([{ transform: 'scale(1.6)' }, { transform: 'scale(.88)', offset: .6 }, { transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.3,1.4,.5,1)' });
      const hp = center(hud); burst(hp.x, hp.y, 16, GOLD, 4); Sound.pick(); cleanup();
    };
  };
  const landed = () => {
    if (st.landed) return; st.landed = true;
    const r = fig.getBoundingClientRect(), px = r.left + r.width / 2, py = r.top + r.height * .6;
    pop(ttl, 0); pop(rib, 120);
    if (!reduce) { burst(px, py, 26, GOLD, 6); ring(px, r.top + r.height - 2, 2); Sound.intro(); }
    later(preview ? 1700 : 1150, finish);
  };
  const tap = () => {
    if (st.fin || (!manual && Date.now() - st.t0 < 450)) return;
    if (!st.landed) { timers.forEach(clearTimeout); timers.length = 0; anims.forEach(a => { try { a.finish(); } catch (_) {} }); landed(); later(750, finish); } else finish();
  };
  root.addEventListener('pointerdown', tap);
  if (reduce) { anims.forEach(a => { try { a.finish(); } catch (_) {} }); landed(); }
  else later(T0 + D.land, landed);
  later(T0 + D.dur + 7000, finish);
  return { root, D, S, G, seek: ms => anims.forEach(a => { a.pause(); a.currentTime = ms; }), landed, finish };
}

/* ---------------- Onboarding / Personalisierung ---------------- */
function showOnboarding() {
  queueOverlay(done => {
    const ov = $('#ov'), pf = S.profile; let av = avId(pf.avatar);
    ov.innerHTML = `<div class="ovc onb"><div class="card">
      <div class="avwrap"><div class="avbig${avArt(av)}" id="onAv" style="${avStyle(av)}">${avatarHTML(av)}</div><button class="avplay" id="onPlay" aria-label="${esc(t('entWatch'))}"></button></div><div class="avname" id="onAvName">${esc(avName(av))}</div>
      <h3 style="margin:2px 0 8px;font-size:22px">${t('onbTitle')}</h3>
      <label>${t('yourName')}<input id="onName" maxlength="16" placeholder="${t('namePh')}" value="${esc(pf.name)}"></label>
      <label>${t('cafeName')}<input id="onCafe" maxlength="24" placeholder="${t('cafePh')}" value="${esc(pf.cafe)}"></label>
      <div class="sug" id="onSug"></div>
      <label>${t('pickAv')}</label>
      <div class="avs">${AV.map(a => `<button data-av="${a.id}" class="${a.id === av ? 'on' : ''}${avArt(a.id)}" style="${avStyle(a.id)}" aria-label="${esc(avName(a.id))}">${avatarHTML(a.id)}</button>`).join('')}</div>
      <button class="btn g big" id="onGo">${t('letsGo')}</button></div></div>`;
    ov.hidden = false;
    const sug = () => {
      const n = $('#onName').value.trim();
      const own = LANG === 'de' ? (/[sßxz]$/i.test(n) ? `${n}' Café` : `${n}s Café`) : `${n}'s Café`;
      const list = (n ? [own] : []).concat(CAFE_SUG[LANG]).slice(0, 4);
      $('#onSug').innerHTML = list.map(s => `<button>${esc(s)}</button>`).join('');
    };
    sug(); $('#onName').addEventListener('input', sug);
    $('#onSug').onclick = e => { const b = e.target.closest('button'); if (b) { $('#onCafe').value = b.textContent; Sound.click(); } };
    ov.querySelector('.avs').onclick = e => {
      const b = e.target.closest('[data-av]'); if (!b) return; av = b.dataset.av; Sound.pick(); preArt('e' + av.slice(1));
      ov.querySelectorAll('.avs button').forEach(x => x.classList.toggle('on', x === b));
      const big = $('#onAv'); big.setAttribute('style', avStyle(av)); big.className = 'avbig' + avArt(av); big.innerHTML = avatarHTML(av); $('#onAvName').textContent = avName(av);
      restartCls(big, 'bounce', 520);
    };
    const prev = () => { if (!entLive) { Sound.click(); playEntrance(av, { preview: true }); } };
    $('#onAv').onclick = prev; $('#onPlay').onclick = prev;
    $('#onGo').onclick = () => {
      const first = !pf.done, changed = first || avId(pf.avatar) !== av;
      pf.name = $('#onName').value.trim().slice(0, 16); pf.cafe = $('#onCafe').value.trim().slice(0, 24); pf.avatar = av;
      pf.done = true; save();
      if (first) Platform.track('onboarding_complete');
      render();
      if (!changed) { ov.hidden = true; Sound.intro(); const p = center($('#brand')); burst(p.x, p.y, 30, GOLD, 6); done(); return; }
      /* Neue Figur: sie läuft groß ein und fliegt danach ins Kopfband (Tippen überspringt) */
      let fade = null; ov.innerHTML = '';
      playEntrance(av, { onFly: () => { fade = ov.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 480, easing: 'ease-in', fill: 'forwards' }); },
        done: () => { ov.hidden = true; if (fade) fade.cancel(); done(); } });
    };
  });
}

/* ---------------- Splash / Start ---------------- */
function setupSplash() {
  let k = 0; // laufende Buchstabennummer über beide Zeilen
  // Zeile 1: erstes Wort ("Noa's"), Zeile 2: der Rest ("Bean Trail"); Leerzeichen bleiben normaler Text zwischen den Buchstaben
  const [w1, ...rest] = APP_NAME.split(' ');
  $('#spTitle').innerHTML = [w1, rest.join(' ')].filter(Boolean).map((w, wi) => `<span class="ln${wi ? ' ln2' : ''}">${[...w].map(c => { if (c === ' ') return ' '; const i = k++; return `<span style="animation-delay:${.3 + i * .05}s,${1.5 + i * .07}s">${esc(c)}</span>`; }).join('')}</span>`).join('');
  const pf = S.profile, ch = CHAPTERS[worldIdx()];
  const curCh = CHAPTERS.indexOf(chapterFor(S.level));
  $('#spFlags').innerHTML = CHAPTERS.map((c, i) => `<i class="${i > curCh ? 'off' : i === curCh ? 'cur' : ''}" style="--c:${FRAME[i][0]}"></i>`).join('');
  $('#spWelcome').innerHTML = pf.done
    ? `${avatarHTML(pf.avatar)} ${esc(t('welcomeBack', { n: pname() }))}<br><small style="opacity:.85">${esc(pf.cafe || t('defCafe'))} · ${t('level')} ${S.level} · ${ch.ic} ${ch[LANG]}</small>${S.energy >= maxEnergy() && S.stats.sessions > 1 ? `<br><small>${t('energyReady')}</small>` : ''}`
    : t('welcomeNew');
  $('#spPlay').textContent = t('play'); $('#spVer').textContent = 'v' + CONFIG.version;
  $('#spPlay').onclick = () => {
    Sound.unlock(); setTimeout(() => { Sound.intro(); if (S.music) Sound.musicOn(); }, 80);
    const sp = $('#splash'); const p = center($('#spPlay')); burst(p.x, p.y, 40, GOLD, 7);
    document.body.classList.remove('splashing'); Calm.lock(false); sp.classList.add('out'); setTimeout(() => { sp.style.display = 'none'; idle(() => sp.remove()); }, 380);
    started = true;
    if (!S.profile.done) showOnboarding();
    else if (S.tut >= 3 && S.daily.last !== today()) setTimeout(openDaily, 600);
    render();
  };
}
document.addEventListener('pointerdown', () => { if (started) Sound.unlock(); }, { passive: true });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) Sound.pause(); else { if (started) Sound.resume(); render(); }
});
setInterval(() => {
  if (!started || oBusy || drag || !$('#modal').hidden || S.tut < 3) return;
  if (Date.now() - lastAct > 7000) { lastAct = Date.now(); showMergeHint(); }
}, 1000);

window.MC = { ent: (id, o) => playEntrance(id, o), cust: l => custSVG(l), seats: () => seatEls, fill: () => { fillOrders(); render(); }, render: () => render(), close: closeModal, events: () => window.__events || [], state: () => S, audio: () => Sound.state(), world: L => { S.level = L; S.worldPick = null; applyChapter(true); render(); }, levelUp: L => { S.level = L - 1; S.xp = 0; addXP(xpNeed(L - 1)); }, scene: (i, vb, still) => Scenes.svg(i, vb, still),
  disc: (c, tr) => showDiscovery(c, tr), gift: () => addGift(), dbl: o => offerDouble(o || { coins: 80 }), shop: () => openShop(), gems: () => openGems(), noEnergy: () => openNoEnergy(),
  order: i => openOrder(i), daily: () => openDaily(), ups: () => openUpgrades(), settings: () => openSettings(), openGift: () => showGift(), noLimit: () => { lastDbl = 0; } };

/* ---------------- Boot ---------------- */
S = load();
S.stats.sessions++;
Platform.track('session_start', { level: S.level, n: S.stats.sessions });
if (S.stats.sessions === 2) once('second_session');
const daysSince = Math.floor((Date.now() - S.created) / 864e5);
if (daysSince >= 1) once('retained_d1'); if (daysSince >= 7) once('retained_d7');
tickEnergy();
Object.assign(shown, { coins: S.coins, gems: S.gems, energy: S.energy });
$('#coins').textContent = fmt(S.coins); $('#gems').textContent = fmt(S.gems); $('#energy').textContent = S.energy;
applyChapter(); fillOrders(); render(); save(); setupSplash();
afterPaint(() => {
  lastChapter = null; applyChapter();
  setTimeout(() => idle(sizeFx), 350); setTimeout(() => idle(() => Sound.init()), 1000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layoutScene());
});
Platform.init();
setInterval(() => { const e = S.energy; tickEnergy(); if (S.energy !== e) render(); else renderTimer(); }, 1000);
try {
  if ('serviceWorker' in navigator) {
    if (osName() !== 'web') {                                            /* App: die Dateien liegen im Paket, kein Service Worker noetig – alte Eintraege (v1.0–1.5.1) werden entfernt */
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
      if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
    } else if (location.protocol === 'https:' && !location.hostname.endsWith('claude.ai') && !location.hostname.includes('claudeusercontent')) navigator.serviceWorker.register('sw.js').catch(() => {});
  }
} catch (e) {}
})();
</script>
