<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3B2A20">
<title>Merge Café</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#FBF1E3; --bg2:#F3E0C8; --board:#E6D2B8; --cell:#FFF8EE; --cell2:#FBF1E3;
  --ink:#3B2A20; --muted:#8A7362; --accent:#C8553D; --accent2:#E07A5F;
  --green:#4F9D69; --gold:#E8A93B; --blue:#3D7EA6; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
html,body{margin:0;height:100%;color:var(--ink);font-family:Fredoka,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;overscroll-behavior:none;overflow:hidden}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2));transition:background 1s}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 8px)}
#app.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
#brand{display:flex;align-items:center;gap:6px;font-size:13px;margin:0 2px 6px;cursor:pointer;white-space:nowrap;overflow:hidden}
#brand .av{font-size:20px}
#brand b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
#brand .rk{color:var(--muted)}
#brand .ch{margin-left:auto;background:rgba(255,255,255,.7);border-radius:999px;padding:2px 9px;font-size:12px}
#top{display:flex;gap:6px;align-items:center}
.lvl{display:flex;align-items:center;gap:6px;flex:1.2;min-width:0;background:#fff;border-radius:999px;padding:4px 10px 4px 4px;box-shadow:0 2px 0 rgba(59,42,32,.12)}
.lvlnum{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.xpbar{flex:1;height:10px;background:#F0E2D0;border-radius:9px;overflow:hidden}
#xpFill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--accent2));transition:width .6s cubic-bezier(.3,1.4,.5,1);border-radius:9px}
.res{display:flex;align-items:center;gap:3px;background:#fff;border-radius:999px;padding:6px 9px;font-size:14px;box-shadow:0 2px 0 rgba(59,42,32,.12);white-space:nowrap}
.res b{font-weight:600}
.res small{color:var(--muted);font-size:10px;margin-left:2px}
.res.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
#resEnergy,#resGems{cursor:pointer}
#orders{display:flex;gap:8px;margin:10px 0 6px;overflow-x:auto;scrollbar-width:none;min-height:108px;padding:2px}
#orders::-webkit-scrollbar{display:none}
.order{flex:1 0 30%;min-width:104px;background:#fff;border-radius:var(--r);padding:7px;display:flex;flex-direction:column;gap:5px;box-shadow:0 3px 0 rgba(59,42,32,.12);position:relative;transition:transform .25s,opacity .25s}
.order.ready{box-shadow:inset 0 0 0 3px var(--green),0 3px 0 rgba(59,42,32,.12);animation:readyPulse 1.2s infinite;cursor:pointer}
@keyframes readyPulse{50%{transform:translateY(-3px) scale(1.03)}}
.order.leaving{transform:translateY(-30px) scale(.8);opacity:0;animation:none}
.order.new{animation:orderIn .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes orderIn{from{transform:scale(.3);opacity:0}}
.order .who{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.order .who span{font-size:22px}
.order.ready .who::after{content:"!";position:absolute;left:24px;top:2px;background:var(--green);color:#fff;font-weight:700;font-size:11px;border-radius:50%;width:15px;height:15px;text-align:center;line-height:15px}
.order .req{display:flex;gap:4px}
.order .req div{flex:1;background:var(--cell2);border-radius:9px;font-size:24px;text-align:center;padding:3px 0;position:relative}
.order .req div.ok::after{content:"✓";position:absolute;right:2px;bottom:0;font-size:11px;color:#fff;background:var(--green);border-radius:50%;width:14px;height:14px;line-height:14px}
.order .rew{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.order button{background:var(--green);color:#fff;border-radius:9px;font-size:12px;font-weight:600;padding:4px 8px}
.order button:disabled{background:#D8CBBB}
#hint{min-height:22px;font-size:13px;text-align:center;color:var(--accent);font-weight:500;margin-bottom:4px}
#boardWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--board);padding:6px;border-radius:18px;touch-action:none;
  width:min(100%, calc((100dvh - 330px) * 7 / 8));aspect-ratio:7/8;box-shadow:inset 0 2px 6px rgba(59,42,32,.15),0 4px 0 rgba(59,42,32,.08)}
.cell{background:var(--cell);border-radius:10px;display:grid;place-items:center;position:relative;container-type:size;transition:transform .12s}
.cell:nth-child(odd){background:var(--cell2)}
.cell .it{font-size:min(62cqw,40px);line-height:1;transition:transform .12s;pointer-events:none}
.cell.gen{background:linear-gradient(160deg,#FFE3B3,#F7C98B)}
.cell.gen::after{content:"⚡";position:absolute;right:2px;top:1px;font-size:10px}
.cell .tier{position:absolute;left:3px;bottom:1px;font-size:9px;color:var(--muted);font-weight:600;pointer-events:none}
.cell.sel{box-shadow:0 0 0 3px var(--blue) inset}
.cell.want{box-shadow:0 0 0 2px var(--green) inset}
.cell.hover{box-shadow:0 0 0 3px var(--gold) inset;transform:scale(1.06)}
.cell.match{box-shadow:0 0 0 3px #7BD389 inset;background:#E9F8EC}
.cell.dragging .it{opacity:.25}
.cell.incoming .it{opacity:0}
.cell.pulse{animation:pulse 1s infinite}
.cell.pop .it{animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.cell.squash .it{animation:squash .25s}
.cell.hintw .it{animation:wiggle .5s 3}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes squash{40%{transform:scale(1.2,.8)}70%{transform:scale(.9,1.12)}}
@keyframes wiggle{25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,85,61,.7) inset}50%{box-shadow:0 0 0 4px rgba(200,85,61,.9) inset}}
#info{min-height:24px;text-align:center;font-size:13px;color:var(--muted);margin:6px 0 4px}
#bottom{display:flex;gap:6px}
#bottom>*{flex:1;background:#fff;border-radius:var(--r);padding:6px 0;display:flex;flex-direction:column;align-items:center;font-size:22px;box-shadow:0 3px 0 rgba(59,42,32,.12);position:relative}
#bottom>*:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,32,.12)}
#bottom span{font-size:11px;color:var(--muted);margin-top:1px}
#trash{background:#F3E4D6 !important}
#trash.hover{background:#F4C7BC !important;transform:scale(1.08)}
#trash.hintw{animation:wiggle .5s 3}
.dot{position:absolute;top:4px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
#ghost{position:fixed;pointer-events:none;font-size:50px;transform:translate(-50%,-60%) scale(1.1);z-index:50;display:none;filter:drop-shadow(0 8px 8px rgba(0,0,0,.25))}
.flyitem{position:fixed;left:0;top:0;font-size:34px;z-index:52;pointer-events:none;will-change:transform}
.flyitem.small{font-size:20px}
.float{position:fixed;transform:translate(-50%,-50%);font-weight:700;color:#fff;font-size:18px;pointer-events:none;z-index:58;white-space:nowrap;
  text-shadow:0 2px 0 var(--accent),0 0 8px rgba(0,0,0,.25);animation:floatUp 1.1s ease-out forwards}
.float.xp{text-shadow:0 2px 0 var(--blue),0 0 8px rgba(0,0,0,.25)}
.float.word{font-size:40px;color:#FFE27A;-webkit-text-stroke:1.5px #C8553D;text-shadow:0 4px 0 #C8553D,0 8px 18px rgba(0,0,0,.3);animation:wordPop 1.3s forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-230%) scale(1)}}
@keyframes wordPop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.3) rotate(4deg);opacity:1}45%{transform:translate(-50%,-50%) scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%) scale(1.05)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:57}
#hand{position:fixed;left:0;top:0;font-size:40px;z-index:44;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
#hand[hidden]{display:none}
#hand.tap{animation:handTap 1s infinite}
#hand.drag{animation:handDrag 1.8s infinite ease-in-out}
@keyframes handTap{0%,100%{transform:translate(calc(var(--x0) - 14px),calc(var(--y0) + 2px)) scale(1)}50%{transform:translate(calc(var(--x0) - 14px),calc(var(--y0) + 14px)) scale(.88)}}
@keyframes handDrag{0%{transform:translate(calc(var(--x0) - 14px),calc(var(--y0) + 2px));opacity:0}15%{transform:translate(calc(var(--x0) - 14px),calc(var(--y0) + 2px)) scale(.9);opacity:1}70%{transform:translate(calc(var(--x1) - 14px),calc(var(--y1) + 2px)) scale(.9);opacity:1}85%,100%{transform:translate(calc(var(--x1) - 14px),calc(var(--y1) + 2px));opacity:0}}
#modal{position:fixed;inset:0;background:rgba(40,25,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
#modal[hidden]{display:none}
.sheet{background:var(--bg1);width:100%;max-width:520px;max-height:82vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);position:relative;animation:up .3s cubic-bezier(.3,1.3,.5,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#modalClose{position:absolute;right:12px;top:10px;background:#fff;border-radius:50%;width:32px;height:32px;font-size:15px}
.sheet h2{margin:0 0 12px;font-size:22px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:var(--r);padding:10px;margin-bottom:8px}
.row .ic{font-size:30px;width:40px;text-align:center}
.row .tx{flex:1;font-size:14px}
.row .tx small{display:block;color:var(--muted);font-size:12px}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.g{background:var(--green)} .btn.b{background:var(--blue)}
.btn.big{font-size:20px;padding:14px 34px;border-radius:16px}
.btn:disabled{background:#D8CBBB;box-shadow:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.days div{background:#fff;border-radius:10px;padding:6px 2px;text-align:center;font-size:11px}
.days div b{display:block;font-size:20px}
.days div.done{background:#DCEEDD}
.days div.today{outline:3px solid var(--gold);animation:readyPulse 1.2s infinite}
.big{text-align:center;font-size:64px;margin:6px 0}
.center{text-align:center}
.chain{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:24px;margin:8px 0}
.chain span.lock{filter:grayscale(1) brightness(.3);opacity:.35}
.chain span.cur{transform:scale(1.35);filter:drop-shadow(0 0 6px gold)}
#ov{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:rgba(40,22,12,.62);animation:fadeIn .25s;overflow:hidden}
#ov[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}}
.rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,224,130,.22) 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 55%);mask:radial-gradient(circle,#000 10%,transparent 55%)}
@keyframes spin{to{transform:rotate(360deg)}}
.ovc{position:relative;text-align:center;color:#fff;padding:20px;max-width:360px;width:100%}
.ovc h2{font-size:42px;margin:6px 0;color:#FFE27A;-webkit-text-stroke:1.5px #A8432E;text-shadow:0 4px 0 #A8432E;animation:wordPop2 .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes wordPop2{from{transform:scale(.2) rotate(-8deg);opacity:0}}
.lvbadge{width:110px;height:110px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFB199,#C8553D);display:grid;place-items:center;font-size:52px;font-weight:700;color:#fff;
  box-shadow:0 0 0 6px #FFE27A,0 10px 30px rgba(0,0,0,.4);animation:badgeIn .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes badgeIn{from{transform:scale(0) rotate(-180deg)}}
.rank{font-size:18px;margin:4px 0 12px;opacity:.95}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.chips span{background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:16px;opacity:0;animation:chipIn .45s cubic-bezier(.3,1.7,.5,1) forwards;animation-delay:var(--d,0s)}
@keyframes chipIn{from{opacity:0;transform:scale(.3) translateY(10px)}to{opacity:1;transform:none}}
.chapter{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.95);color:var(--ink);border-radius:16px;padding:10px 14px;margin:12px auto;text-align:left;opacity:0;animation:chipIn .5s cubic-bezier(.3,1.7,.5,1) forwards;animation-delay:var(--d,0s)}
.chapter b{font-size:40px}.chapter small{display:block;color:var(--muted)}.chapter div{font-size:18px;font-weight:600}
.card{background:var(--bg1);color:var(--ink);border-radius:22px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:wordPop2 .5s cubic-bezier(.3,1.6,.5,1)}
.disc-em{font-size:88px;margin:4px 0;animation:floaty 2s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px) rotate(4deg)}}
.giftbox{font-size:120px;cursor:pointer;display:inline-block;animation:floaty 1.6s ease-in-out infinite}
.giftbox.hit{animation:giftHit .3s}
@keyframes giftHit{25%{transform:rotate(-14deg) scale(1.12)}75%{transform:rotate(14deg) scale(1.12)}}
.onb input{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:2px solid #E6D2B8;border-radius:12px;margin:4px 0 10px;background:#fff;color:var(--ink)}
.onb input:focus{outline:none;border-color:var(--accent)}
.onb label{display:block;text-align:left;font-weight:600;font-size:14px}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.sug button{background:#fff;border-radius:999px;padding:5px 10px;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 14px}
.avs button{font-size:34px;background:#fff;border-radius:14px;padding:6px 0;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.avs button.on{outline:3px solid var(--accent);transform:scale(1.06)}
#splash{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 20%,#FFD8B8,#E58A6B 55%,#7A3B2A);color:#fff;transition:opacity .5s,transform .5s}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splash .rays{-webkit-mask:radial-gradient(circle,#000 15%,transparent 60%);mask:radial-gradient(circle,#000 15%,transparent 60%)}
.sp-logo{position:relative;font-size:110px;animation:logoIn 1s cubic-bezier(.3,1.6,.5,1),floaty 3s 1s ease-in-out infinite;filter:drop-shadow(0 12px 20px rgba(0,0,0,.3))}
@keyframes logoIn{from{transform:scale(0) rotate(-30deg)}}
.steam{position:absolute;left:50%;top:-30px;width:60px;margin-left:-38px;display:flex;justify-content:space-between}
.steam i{width:8px;height:34px;border-radius:8px;background:rgba(255,255,255,.75);animation:steam 2s ease-in-out infinite;opacity:0}
.steam i:nth-child(2){animation-delay:.5s}.steam i:nth-child(3){animation-delay:1s}
@keyframes steam{0%{transform:translateY(10px) scaleY(.5);opacity:0}40%{opacity:.8}100%{transform:translateY(-30px) scaleY(1.2) translateX(6px);opacity:0}}
.sp-title{font-size:48px;font-weight:700;margin:0;letter-spacing:1px;color:#FFF3D6;text-shadow:0 4px 0 #A8432E,0 10px 20px rgba(0,0,0,.3)}
.sp-title span{display:inline-block;animation:letter .6s cubic-bezier(.3,1.8,.5,1) backwards,bounceL 2.4s ease-in-out infinite}
@keyframes letter{from{transform:translateY(-80px) scale(.3);opacity:0}}
@keyframes bounceL{0%,70%,100%{transform:none}80%{transform:translateY(-8px)}}
.sp-orbit{display:flex;gap:10px;font-size:30px;margin:4px 0 10px}
.sp-orbit span{animation:floaty 2.2s ease-in-out infinite}
#spWelcome{font-size:17px;text-align:center;min-height:48px;margin:4px 16px 14px;text-shadow:0 2px 4px rgba(0,0,0,.25)}
#spPlay{background:linear-gradient(#7BD389,#4F9D69);font-size:24px;padding:16px 56px;border-radius:20px;box-shadow:0 6px 0 #2E6B45,0 12px 24px rgba(0,0,0,.3);animation:readyPulse 1.4s infinite}
#splash small{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);opacity:.6;font-size:11px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
#toast.on{opacity:1}
#adOverlay{position:fixed;inset:0;background:#111;color:#fff;z-index:75;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:18px}
#adOverlay[hidden]{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="brand"><span class="av" id="bAv">🧑‍🍳</span><b id="bCafe">Merge Café</b><span class="rk" id="bRank"></span><span class="ch" id="bChap"></span></div>
  <header id="top">
    <div class="lvl" id="lvlBox"><div class="lvlnum" id="lvlNum">1</div><div class="xpbar"><div id="xpFill"></div></div></div>
    <div class="res" id="resEnergy">⚡<b id="energy">100</b><small id="eTimer"></small></div>
    <div class="res" id="resCoins">🪙<b id="coins">0</b></div>
    <div class="res" id="resGems">💎<b id="gems">0</b></div>
  </header>
  <section id="orders"></section>
  <div id="hint"></div>
  <div id="boardWrap"><main id="board"></main></div>
  <div id="info"></div>
  <nav id="bottom">
    <button data-open="shop">🛒<span data-t="shop"></span></button>
    <button data-open="upgrades">🔧<span data-t="upgrades"></span></button>
    <div id="trash">🗑️<span data-t="sell"></span></div>
    <button data-open="daily" id="dailyBtn">🎁<span data-t="daily"></span></button>
    <button data-open="settings">⚙️<span data-t="settings"></span></button>
  </nav>
</div>
<div id="modal" hidden><div class="sheet"><button id="modalClose" aria-label="close">✕</button><div id="modalBody"></div></div></div>
<div id="ov" hidden></div>
<canvas id="fx"></canvas>
<div id="hand" hidden>👆</div>
<div id="toast"></div>
<div id="adOverlay" hidden><div>📺</div><div id="adText"></div></div>
<div id="ghost"></div>
<div id="splash">
  <div class="rays"></div>
  <div class="sp-logo"><div class="steam"><i></i><i></i><i></i></div>☕</div>
  <h1 class="sp-title" id="spTitle">Merge Café</h1>
  <div class="sp-orbit"><span>🥐</span><span style="animation-delay:.3s">🧋</span><span style="animation-delay:.6s">🍩</span><span style="animation-delay:.9s">🧁</span><span style="animation-delay:1.2s">🥞</span></div>
  <div id="spWelcome"></div>
  <button id="spPlay"></button>
  <small id="spVer"></small>
</div>

<script>
/* =====================================================================
   Merge Café — v1.1.0
   Single-file HTML5 game. Runs in browsers (web portals, PWA) and inside
   Capacitor (Android/iOS). Native SDKs (AppsFlyer, AdMob, RevenueCat)
   are used automatically when present; web falls back to demo stubs.
   All sounds and music are synthesized at runtime (original, no assets).
   ===================================================================== */
const CONFIG = {
  version: '1.1.0',

  $('#hint').textContent = S.tut === 0 ? t('tut0') : S.tut === 1 ? t('tut1') : S.tut === 2 ? t('tut2') : '';
  $('#dailyBtn').querySelector('.dot')?.remove();
  if (S.daily.last !== today()) $('#dailyBtn').insertAdjacentHTML('beforeend', '<i class="dot"></i>');
  renderInfo();
  requestAnimationFrame(updateHand);
}
function renderTimer() {
  const m = maxEnergy();
  if (S.energy >= m) { $('#eTimer').textContent = ''; return; }
  const left = Math.max(0, CONFIG.energyRegenMs - (Date.now() - S.eTs)), s = Math.ceil(left / 1000);
  $('#eTimer').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
function renderInfo() {
  const it = S.b[selected];
  if (!it) { $('#info').textContent = ''; return; }
  if (it.g !== undefined) { $('#info').textContent = `${CHAINS[it.g].gen} ${itemName(it)} — ${t('genTap')} ${CHAINS[it.g].items[0]} (${t('cost')})`; return; }
  const mt = maxTier(it.c);
  $('#info').textContent = `${itemName(it)} · ${t('tier')} ${it.t + 1}/${mt + 1}` + (it.t < mt ? ` · ${t('next')}: ${CHAINS[it.c].items[it.t + 1]}` : ` · ${t('maxed')}`);
}
let toastT;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2400); }

/* ---------------- Tutorial-Hand ---------------- */
let started = false;
function updateHand() {
  const h = $('#hand');
  if (!started || oBusy || !$('#modal').hidden || S.tut >= 3 || drag) { h.hidden = true; return; }
  let a = null, b = null;
  const genEl = () => cellEls[S.b.findIndex(it => it && it.g === 0)];
  if (S.tut === 0) a = genEl();
  else if (S.tut === 1) {
    const beans = []; S.b.forEach((it, i) => { if (it && it.g === undefined && it.c === 0 && it.t === 0 && !incoming.has(i)) beans.push(i); });
    if (beans.length >= 2) { a = cellEls[beans[0]]; b = cellEls[beans[1]]; } else a = genEl();
  } else if (S.tut === 2) a = document.querySelector('.order.ready') || genEl();
  if (!a) { h.hidden = true; return; }
  const pa = center(a); h.hidden = false;
  h.style.setProperty('--x0', pa.x + 'px'); h.style.setProperty('--y0', pa.y + 'px');
  if (b) { const pb = center(b); h.style.setProperty('--x1', pb.x + 'px'); h.style.setProperty('--y1', pb.y + 'px'); if (h.className !== 'drag') h.className = 'drag'; }
  else if (h.className !== 'tap') h.className = 'tap';
}
addEventListener('resize', () => { sizeFx(); updateHand(); });

/* ---------------- Drag & drop ---------------- */
const ghost = $('#ghost');
let drag = null, lastAct = Date.now();
function targetAt(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  if (el.closest('#trash')) return { trash: true };
  const c = el.closest('.cell'); return c ? { cell: +c.dataset.i } : null;
}
let hoverEl = null;
function setHover(el) { if (hoverEl === el) return; hoverEl && hoverEl.classList.remove('hover'); hoverEl = el; el && el.classList.add('hover'); }
boardEl.addEventListener('pointerdown', e => {
  lastAct = Date.now();
  const c = e.target.closest('.cell'); if (!c) return;
  const i = +c.dataset.i; if (!S.b[i]) { selected = -1; render(); return; }
  drag = { i, x: e.clientX, y: e.clientY, moved: false };
  try { boardEl.setPointerCapture(e.pointerId); } catch (_) {}
});
boardEl.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 7) {
    drag.moved = true; ghost.textContent = itemEmoji(S.b[drag.i]); ghost.style.display = 'block';
    cellEls[drag.i].classList.add('dragging'); Sound.pick(); $('#hand').hidden = true;
  }
  if (drag.moved) {
    ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
    const tg = targetAt(e.clientX, e.clientY);
    setHover(tg ? (tg.trash ? $('#trash') : cellEls[tg.cell]) : null);
  }
});
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null; lastAct = Date.now();
  ghost.style.display = 'none'; setHover(null);
  cellEls[d.i].classList.remove('dragging');
  if (!d.moved) {
    const it = S.b[d.i];
    selected = d.i;
    if (it && it.g !== undefined) spawn(d.i); else { Sound.click(); render(); }
    return;
  }
  const tg = e.type === 'pointercancel' ? null : targetAt(e.clientX, e.clientY);
  if (!tg) { render(); return; }
  if (tg.trash) { sell(d.i); selected = -1; return; }
  selected = tg.cell; dropOn(d.i, tg.cell);
}
boardEl.addEventListener('pointerup', endDrag);
boardEl.addEventListener('pointercancel', endDrag);

$('#orders').addEventListener('click', e => {
  lastAct = Date.now();
  const card = e.target.closest('.order'); if (!card || card.classList.contains('leaving')) return;
  if (card.classList.contains('ready')) deliver(+card.dataset.ord); else Sound.bonk();
});

/* ---------------- Modals ---------------- */
function openModal(html) { $('#modalBody').innerHTML = html; $('#modal').hidden = false; $('#hand').hidden = true; Sound.click(); }
function closeModal() { $('#modal').hidden = true; render(); }
$('#modalClose').onclick = closeModal;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function openShop() {
  if (S.ads.day !== today()) S.ads = { day: today(), n: 0 };
  const adsLeft = 6 - S.ads.n;
  const packs = [
    !S.starter && { sku:'starter_pack', ic:'🎁', name:t('starter'), d:`💎100 + 🪙500 · ${t('oneTime')}`, price:'1,99 €' },
    { sku:'gems_small', ic:'💎', name:t('gemsS'), d:'💎 60', price:'0,99 €' },
    { sku:'gems_large', ic:'💰', name:t('gemsM'), d:'💎 400', price:'4,99 €' }
  ].filter(Boolean);
  openModal(`<h2>🛒 ${t('shop')}</h2>
    <div class="row"><div class="ic">📺</div><div class="tx">${t('watchAd')}<small>+25 ⚡ · ${adsLeft} ${t('adsLeft')}</small></div>
      <button class="btn b" data-act="ad" ${adsLeft <= 0 ? 'disabled' : ''}>${adsLeft > 0 ? t('free') : t('limitAds')}</button></div>
    <div class="row"><div class="ic">⚡</div><div class="tx">${t('refill')}<small>${maxEnergy()} ⚡</small></div>
      <button class="btn" data-act="refill">💎 15</button></div>
    ${packs.map(p => `<div class="row"><div class="ic">${p.ic}</div><div class="tx">${p.name}<small>${p.d}</small></div><button class="btn g" data-buy="${p.sku}">${p.price}</button></div>`).join('')}
    <h3>${t('collection')}</h3>
    ${CHAINS.map((c, ci) => `<div class="chain">${c.items.map((e, ti) => `<span class="${S.seen[ci + ':' + ti] || ti === 0 ? '' : 'lock'}">${e}</span>`).join('')}</div>`).join('')}`);
}
const GRANTS = { starter_pack: { gems:100, coins:500 }, gems_small: { gems:60 }, gems_large: { gems:400 } };
async function buy(sku) {
  const r = await Platform.purchase(sku);
  if (r === null) { toast(t('onlyApp')); return; }
  if (!r) { toast(t('purchaseFail')); return; }
  const g = GRANTS[sku]; S.gems += g.gems || 0; S.coins += g.coins || 0;
  if (sku === 'starter_pack') S.starter = true;
  Platform.track('purchase', { sku }); once('first_purchase', { sku });
  Sound.giftOpen(); rain(80); toast(t('thanks')); save(); openShop(); render();
}
async function watchAd() {
  if (S.ads.n >= 6) return;
  const ok = await Platform.showRewarded();
  if (!ok) { toast(t('adFail')); return; }
  S.ads.n++; S.energy += 25; Platform.track('ad_rewarded', { placement: 'shop_energy' });
  Sound.giftOpen(); save(); openShop(); render();
}
function refill() {
  if (S.energy >= maxEnergy()) { toast(t('energyFull')); return; }
  if (S.gems < 15) { toast(`${t('notEnough')} 💎`); Sound.bonk(); return; }
  S.gems -= 15; S.energy = maxEnergy(); S.eTs = Date.now();
  Platform.track('spend_gems', { what: 'energy', amount: 15 }); Sound.giftOpen(); save(); openShop(); render();
}
const UPS = [
  { k:'gen', ic:'⚙️', n:'upGen', d:'upGenD', max:5, cost:l => 80 * Math.pow(2, l) },
  { k:'bat', ic:'🔋', n:'upBat', d:'upBatD', max:5, cost:l => 150 * Math.pow(2, l) },
  { k:'slots', ic:'🪑', n:'upSlots', d:'upSlotsD', max:2, cost:l => [600, 2500][l] }
];
function openUpgrades() {
  openModal(`<h2>🔧 ${t('upgrades')}</h2>` + UPS.map(u => {
    const l = S.up[u.k], maxed = l >= u.max, c = maxed ? 0 : u.cost(l);
    return `<div class="row"><div class="ic">${u.ic}</div><div class="tx">${t(u.n)} <b>${l}/${u.max}</b><small>${t(u.d)}</small></div>
      <button class="btn" data-up="${u.k}" ${maxed || S.coins < c ? 'disabled' : ''}>${maxed ? t('max') : '🪙 ' + fmt(c)}</button></div>`;
  }).join(''));
}
function buyUp(k) {
  const u = UPS.find(x => x.k === k), l = S.up[k];
  if (l >= u.max) return; const c = u.cost(l);
  if (S.coins < c) { Sound.bonk(); return; }
  S.coins -= c; S.up[k]++;
  Platform.track('upgrade', { type: k, level: S.up[k] }); once('first_upgrade');
  if (k === 'slots') fillOrders();
  Sound.levelUp(); save(); openUpgrades(); render();
}
function openDaily() {
  const claimedToday = S.daily.last === today();
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  const streak = claimedToday ? S.daily.streak : (S.daily.last === y ? S.daily.streak + 1 : 1);
  const idx = (streak - 1) % 7;
  openModal(`<h2>🎁 ${t('dailyT')}</h2><div class="days">${DAILY.map((r, i) => {
    const ic = r.coins ? '🪙' : r.energy ? '⚡' : '💎', v = r.coins || r.energy || r.gems;
    return `<div class="${i < idx || (claimedToday && i === idx) ? 'done' : ''} ${i === idx ? 'today' : ''}">${t('day')} ${i + 1}<b>${ic}</b>${v}</div>`;
  }).join('')}</div><div class="center"><button class="btn g big" data-act="claim" ${claimedToday ? 'disabled' : ''}>${claimedToday ? t('claimed') : t('claim')}</button></div>`);
}
function claimDaily(btn) {
  if (S.daily.last === today()) return;
  const p = btn ? center(btn) : { x: innerWidth / 2, y: innerHeight / 2 };
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  S.daily.streak = S.daily.last === y ? S.daily.streak + 1 : 1;
  S.daily.last = today();
  const r = DAILY[(S.daily.streak - 1) % 7];
  S.coins += r.coins || 0; S.gems += r.gems || 0; S.energy += r.energy || 0;
  Platform.track('daily_claim', { streak: S.daily.streak });
  if (S.daily.streak === 7) once('daily_streak_7');
  Sound.giftOpen(); burst(p.x, p.y, 40, GOLD, 7); vibrate([15, 30, 15]);
  save(); openDaily(); render();
}
let resetArm = false;
function openSettings() {
  resetArm = false;
  const tgl = (act, ic, label, on) => `<div class="row"><div class="ic">${ic}</div><div class="tx">${label}</div><button class="btn ${on ? 'g' : ''}" data-act="${act}">${on ? t('on') : t('off')}</button></div>`;
  openModal(`<h2>⚙️ ${t('settings')}</h2>
    <div class="row"><div class="ic">${S.profile.avatar}</div><div class="tx">${t('profile')}<small>${esc(pname())} · ${esc(S.profile.cafe || t('defCafe'))}</small></div><button class="btn b" data-act="profile">${t('edit')}</button></div>
    ${tgl('sound', '🔊', t('sfx'), S.sound)}${tgl('music', '🎵', t('music'), S.music)}${tgl('vib', '📳', t('vib'), S.vib)}
    <div class="row"><div class="ic">🔒</div><div class="tx">${t('privacy')}</div><a class="btn b" style="text-decoration:none" href="privacy.html">↗</a></div>
    <div class="row"><div class="ic">🗑️</div><div class="tx">${t('reset')}</div><button class="btn" data-act="reset">${t('reset')}</button></div>
    <p class="center" style="color:var(--muted);font-size:12px">Merge Café v${CONFIG.version} · ${osName()}</p>`);
}
$('#modalBody').addEventListener('click', e => {
  const a = e.target.closest('[data-act],[data-buy],[data-up]'); if (!a) return;
  if (a.dataset.buy) return buy(a.dataset.buy);
  if (a.dataset.up) return buyUp(a.dataset.up);
  const act = a.dataset.act;
  if (act === 'ad') watchAd();
  else if (act === 'refill') refill();
  else if (act === 'claim') claimDaily(a);
  else if (act === 'sound') { S.sound = !S.sound; save(); openSettings(); }
  else if (act === 'music') { S.music = !S.music; S.music ? Sound.musicOn() : Sound.musicOff(); save(); openSettings(); }
  else if (act === 'vib') { S.vib = !S.vib; save(); vibrate(30); openSettings(); }
  else if (act === 'profile') { closeModal(); showOnboarding(); }
  else if (act === 'reset') {
    if (!resetArm) { resetArm = true; a.textContent = t('resetSure'); return; }
    S = fresh(); Object.assign(shown, { coins: 0, gems: S.gems, energy: S.energy }); fillOrders(); save(); closeModal(); lastChapter = null; applyChapter(); showOnboarding();
  }
});
document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => {
  ({ shop: openShop, upgrades: openUpgrades, daily: openDaily, settings: openSettings })[b.dataset.open]();
}));
$('#resEnergy').onclick = openShop; $('#resGems').onclick = openShop;
$('#brand').onclick = () => showOnboarding();
document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));

/* ---------------- Onboarding / Personalisierung ---------------- */
function showOnboarding() {
  queueOverlay(done => {
    const ov = $('#ov'), pf = S.profile; let av = pf.avatar;
    ov.innerHTML = `<div class="ovc onb"><div class="card">
      <div style="font-size:54px" id="onAv">${av}</div><h3 style="margin:4px 0 12px;font-size:22px">${t('onbTitle')}</h3>
      <label>${t('yourName')}<input id="onName" maxlength="16" placeholder="${t('namePh')}" value="${esc(pf.name)}"></label>
      <label>${t('cafeName')}<input id="onCafe" maxlength="24" placeholder="${t('cafePh')}" value="${esc(pf.cafe)}"></label>
      <div class="sug" id="onSug"></div>
      <label>${t('pickAv')}</label>
      <div class="avs">${AVATARS.map(a => `<button data-av="${a}" class="${a === av ? 'on' : ''}">${a}</button>`).join('')}</div>
      <button class="btn g big" id="onGo">${t('letsGo')}</button></div></div>`;
    ov.hidden = false;
    const sug = () => {
      const n = $('#onName').value.trim();
      const own = LANG === 'de' ? (/[sßxz]$/i.test(n) ? `${n}' Café` : `${n}s Café`) : `${n}'s Café`;
      const list = (n ? [own] : []).concat(CAFE_SUG[LANG]);
      $('#onSug').innerHTML = list.map(s => `<button>${esc(s)}</button>`).join('');
    };
    sug(); $('#onName').addEventListener('input', sug);
    $('#onSug').onclick = e => { const b = e.target.closest('button'); if (b) { $('#onCafe').value = b.textContent; Sound.click(); } };
    ov.querySelector('.avs').onclick = e => {
      const b = e.target.closest('[data-av]'); if (!b) return; av = b.dataset.av; Sound.pick();
      ov.querySelectorAll('.avs button').forEach(x => x.classList.toggle('on', x === b)); $('#onAv').textContent = av;
    };
    $('#onGo').onclick = () => {
      pf.name = $('#onName').value.trim().slice(0, 16); pf.cafe = $('#onCafe').value.trim().slice(0, 24); pf.avatar = av;
      const first = !pf.done; pf.done = true; save();
      ov.hidden = true; Sound.intro();
      if (first) Platform.track('onboarding_complete');
      render(); const p = center($('#brand')); burst(p.x, p.y, 30, GOLD, 6); done();
    };
  });
}

/* ---------------- Splash / Start ---------------- */
function setupSplash() {
  $('#spTitle').innerHTML = 'Merge Café'.split('').map((c, i) => `<span style="animation-delay:${.3 + i * .06}s,${1.5 + i * .08}s">${c === ' ' ? '&nbsp;' : c}</span>`).join('');
  const pf = S.profile, ch = chapterFor(S.level);
  $('#spWelcome').innerHTML = pf.done
    ? `${pf.avatar} ${esc(t('welcomeBack', { n: pname() }))}<br><small style="opacity:.85">${esc(pf.cafe || t('defCafe'))} · ${t('level')} ${S.level} · ${ch.ic} ${ch[LANG]}</small>${S.energy >= maxEnergy() && S.stats.sessions > 1 ? `<br><small>${t('energyReady')}</small>` : ''}`
    : t('welcomeNew');
  $('#spPlay').textContent = t('play'); $('#spVer').textContent = 'v' + CONFIG.version;
  $('#spPlay').onclick = () => {
    Sound.unlock(); setTimeout(() => { Sound.intro(); if (S.music) Sound.musicOn(); }, 80);
    const sp = $('#splash'); const p = center($('#spPlay')); burst(p.x, p.y, 40, GOLD, 7);
    sp.classList.add('out'); setTimeout(() => sp.remove(), 520);
    started = true;
    if (!S.profile.done) showOnboarding();
    else if (S.tut >= 3 && S.daily.last !== today()) setTimeout(openDaily, 600);
    render();
  };
}
document.addEventListener('pointerdown', () => { if (started) Sound.unlock(); }, { passive: true });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) Sound.pause(); else { if (started) Sound.resume(); render(); }
});
setInterval(() => {
  if (!started || oBusy || drag || !$('#modal').hidden || S.tut < 3) return;
  if (Date.now() - lastAct > 7000) { lastAct = Date.now(); showMergeHint(); }
}, 1000);

window.MC = { close: closeModal, events: () => window.__events || [], state: () => S, audio: () => Sound.state() };

/* ---------------- Boot ---------------- */
S = load();
S.stats.sessions++;
Platform.track('session_start', { level: S.level, n: S.stats.sessions });
if (S.stats.sessions === 2) once('second_session');
const daysSince = Math.floor((Date.now() - S.created) / 864e5);
if (daysSince >= 1) once('retained_d1'); if (daysSince >= 7) once('retained_d7');
tickEnergy();
Object.assign(shown, { coins: S.coins, gems: S.gems, energy: S.energy });
$('#coins').textContent = fmt(S.coins); $('#gems').textContent = fmt(S.gems); $('#energy').textContent = S.energy;
applyChapter(); fillOrders(); render(); save(); setupSplash();
Platform.init();
setInterval(() => { const e = S.energy; tickEnergy(); if (S.energy !== e) render(); else renderTimer(); }, 1000);
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !location.hostname.endsWith('claude.ai') && !location.hostname.includes('claudeusercontent')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
})();
</script>
