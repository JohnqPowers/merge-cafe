:root{
  --bg1:#FBF1E3; --bg2:#F3E0C8; --board:#E6D2B8; --cell:#FFF8EE; --cell2:#FBF1E3;
  --ink:#3B2A20; --muted:#8A7362; --accent:#C8553D; --accent2:#E07A5F;
  --green:#4F9D69; --gold:#E8A93B; --blue:#3D7EA6; --r:14px; --awn1:#2E628C; --awn2:#F4F8FC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
html,body{margin:0;height:100%;color:var(--ink);font-family:Fredoka,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;overscroll-behavior:none;overflow:hidden}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2));transition:background 1s}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 8px)}
#app.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
#brand{display:flex;align-items:center;gap:6px;font-size:13px;margin:0 2px 6px;cursor:pointer;white-space:nowrap;overflow:hidden}
#brand .av{display:grid;place-items:center;width:26px;height:26px;flex:none;font-size:19px;line-height:1}
#brand .av .avi{width:100%;height:100%;vertical-align:baseline}
#brand b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
#brand .rk{color:var(--muted)}
#brand .ch{margin-left:auto;background:rgba(255,255,255,.7);border-radius:999px;padding:2px 9px;font-size:12px;position:relative;overflow:hidden;flex:none}
#top{display:flex;gap:6px;align-items:center}
.lvl{display:flex;align-items:center;gap:6px;flex:1.2;min-width:0;background:#fff;border-radius:999px;padding:4px 10px 4px 4px;box-shadow:0 2px 0 rgba(59,42,32,.12)}
.lvlnum{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.xpbar{flex:1;height:10px;background:#F0E2D0;border-radius:9px;overflow:hidden}
#xpFill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--accent2));transition:width .6s cubic-bezier(.3,1.4,.5,1);border-radius:9px}
.res{display:flex;align-items:center;gap:3px;background:#fff;border-radius:999px;padding:6px 9px;font-size:14px;box-shadow:0 2px 0 rgba(59,42,32,.12);white-space:nowrap}
.res b{font-weight:600}
.res small{color:var(--muted);font-size:10px;margin-left:2px}
.res.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
#resEnergy,#resGems{cursor:pointer}
/* ---- Café-Tresen: Markise, Gäste, Holztheke ---- */
#orders{position:relative;margin:6px 0 4px;height:130px;border-radius:16px;overflow:hidden;
  background:radial-gradient(circle at 9px 9px,rgba(255,255,255,.5) 1.5px,#0000 2.1px) 0 0/18px 18px,linear-gradient(var(--cell),var(--cell2));
  box-shadow:0 3px 0 rgba(59,42,32,.16),inset 0 0 0 2px rgba(255,255,255,.55)}
.awn{position:absolute;left:0;right:0;top:0;height:9px;background:repeating-linear-gradient(90deg,var(--awn1) 0 14px,var(--awn2) 14px 28px);box-shadow:0 1px 0 rgba(0,0,0,.16);transition:filter .6s}
.awn::after{content:"";position:absolute;left:0;right:0;top:100%;height:8px;background:radial-gradient(circle at 7px 0,var(--awn1) 6.5px,#0000 7.1px) 0 0/28px 8px,radial-gradient(circle at 21px 0,var(--awn2) 6.5px,#0000 7.1px) 0 0/28px 8px}
.seats{position:absolute;inset:0;display:flex}
#orders.cat .seats{right:44px}
.order{position:relative;flex:1 1 0;min-width:0}
.order.ready{cursor:pointer}
.bub{position:absolute;left:5px;right:5px;top:9px;height:30px;display:flex;align-items:center;justify-content:center;gap:3px;background:#fff;border:2px solid rgba(59,42,32,.1);border-radius:13px;box-shadow:0 2px 0 rgba(59,42,32,.15);transition:background .2s,border-color .2s}
.bub::after{content:"";position:absolute;left:19px;bottom:-6px;width:9px;height:9px;background:inherit;border:inherit;border-top:0;border-left:0;border-radius:0 0 3px 0;transform:rotate(45deg)}
.order.ready .bub{background:#EDF9F0;border-color:var(--green)}
.rq{position:relative;width:24px;height:24px;display:grid;place-items:center;font-size:18px;line-height:1;background:var(--cell2);border-radius:8px}
.rq.pop{animation:rqPop .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes rqPop{40%{transform:scale(1.4) rotate(-6deg)}}
.rq.ok::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;line-height:12px;font-size:9px;text-align:center;color:#fff;background:var(--green);border-radius:50%;box-shadow:0 0 0 1.5px #fff}
.cus{position:absolute;left:7px;bottom:24px;width:52px;height:52px;pointer-events:none}
.cus svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 100%;animation:cusBob 3.4s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes cusBob{50%{transform:translateY(-1.5px) rotate(.8deg)}}
.rw{position:absolute;right:6px;bottom:40px;text-align:right;line-height:1.15;pointer-events:none;white-space:nowrap}
.rw b{display:block;font-size:13px;font-weight:600}
.rw small{font-size:10.5px;color:var(--muted)}
.plate{position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(#E6B880 0 3px,#C48A55 3px 4px,#B57841 4px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.14)}
.plate::before{content:"";position:absolute;left:0;right:0;top:4px;bottom:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 1px,#0000 1px 31px)}
.plate button{position:absolute;left:8px;right:8px;top:6px;height:17px;padding:0;border-radius:9px;font-size:11px;font-weight:600;line-height:17px;background:rgba(255,255,255,.2);color:rgba(255,255,255,.82);box-shadow:inset 0 1px 0 rgba(0,0,0,.14);transition:background .2s}
.bc{display:none}
.order.ready .plate button{background:var(--green);color:#fff;box-shadow:0 2px 0 #2F7A4B;animation:btnPulse 1s ease-in-out infinite}
@keyframes btnPulse{50%{transform:scale(1.07)}}
.order.ready .cus svg,.order.ready .cus img{animation:cusHop 1s ease-in-out infinite;animation-delay:0s}
.cus.pic{left:6px;width:58px;height:65px;bottom:26px}
.cus img.cg{width:100%;height:100%;display:block;object-fit:contain;object-position:50% 100%;transform-origin:50% 100%;animation:cusBob 3.4s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes cusHop{0%,100%{transform:none}22%{transform:translateY(-4px) scale(.98,1.03)}48%{transform:translateY(0) scale(1.03,.97)}}
.order.empty .bub,.order.empty .rw,.order.empty .plate button{display:none}
.order.empty .cus{color:rgba(120,85,50,.34)}
.order.empty .cus svg{animation:none}
.ey{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s infinite;animation-delay:var(--bd,0s)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.eh,.es,.mo{display:none}
.order.ready .ms,.order.happy .ms{display:none}
.order.ready .mo,.order.happy .mo{display:inline}
.order.happy .ey{display:none}
.order.happy .eh{display:inline}
.order.new .bub,.order.new .cus{animation:cusIn .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes cusIn{from{transform:translateX(34px) scale(.8);opacity:0}}
.order.leaving .cus{animation:cusOut .4s cubic-bezier(.4,0,.8,.5) forwards}
@keyframes cusOut{35%{transform:translateY(-7px) scale(1.07)}to{transform:translateX(-18px) scale(.86);opacity:0}}
.order.leaving .bub{background:#FFF1F3;border-color:#F4A3B5}
.hrt{font-size:20px;line-height:1;animation:hrt .4s cubic-bezier(.3,1.7,.5,1)}
@keyframes hrt{from{transform:scale(.2);opacity:0}}
.order.nope .bub{animation:nope .36s}
@keyframes nope{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#orders.c4 .cus,#orders.c5 .cus{left:50%;margin-left:-26px}
#orders.c4 .cus.pic,#orders.c5 .cus.pic{margin-left:-29px}
#orders.c4 .rw,#orders.c5 .rw,#orders.c4 .bl,#orders.c5 .bl{display:none}
#orders.c4 .bc,#orders.c5 .bc{display:inline}
#orders.c4 .bub::after,#orders.c5 .bub::after{left:50%;margin-left:-5px}
#orders.c5 .bub{left:3px;right:3px;gap:2px}
#orders.c5 .rq{width:21px;height:21px;font-size:16px}
#orders.c5 .plate button{left:5px;right:5px}
/* Café-Katze Mocha */
.catc{position:absolute;right:0;top:0;bottom:0;width:44px;cursor:pointer}
#orders:not(.cat) .catc{display:none}
.cat-svg{position:absolute;left:-2px;bottom:25px;width:42px;height:50px;overflow:visible}
.cat-svg .tail{transform-origin:31px 47px;animation:tailSw 2.6s ease-in-out infinite}
@keyframes tailSw{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(13deg)}}
.cat-svg .hd{transform-origin:21px 32px;animation:headTilt 5.5s ease-in-out infinite}
@keyframes headTilt{0%,100%{transform:rotate(0)}40%{transform:rotate(-3deg)}70%{transform:rotate(2.6deg)}}
.cat-svg .bd{transform-origin:21px 52px;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1,1.025)}}
.catc.happy .ey,.catc.sleep .ey{display:none}
.catc.happy .eh{display:inline}
.catc.sleep:not(.happy) .es{display:inline}
.catc.sleep:not(.happy) .hd{animation:none;transform:rotate(5deg) translateY(2px)}
.catc.hop .cat-svg{animation:catHop .85s}
@keyframes catHop{30%{transform:translateY(-14px)}62%{transform:translateY(0) scale(1.07,.93)}}
.catc .zz,.catc .ch2{position:absolute;pointer-events:none;opacity:0}
.catc .zz{left:28px;top:12px;font-size:12px;font-weight:700;color:#7A6AAE}
.catc.sleep:not(.happy) .zz{animation:zz 2.6s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,6px) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-12px) scale(1.15)}}
.catc .ch2{left:14px;top:6px;font-size:16px}
.catc.happy .ch2{animation:ch2 1.2s ease-out}
@keyframes ch2{0%{opacity:0;transform:translateY(8px) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(1.2)}}
@media (prefers-reduced-motion:reduce){.cus svg,.cus img,.ey,.cat-svg *,.order.ready .plate button{animation:none!important}}
#hint{min-height:0;font-size:13px;text-align:center;color:var(--accent);font-weight:500;margin-bottom:4px}
#boardWrap{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0;position:relative}
#board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--board);padding:6px;border-radius:18px;touch-action:none;
  width:min(100%, calc((45.6dvh - 20px) * 7 / 8));aspect-ratio:7/8;box-shadow:inset 0 2px 6px rgba(59,42,32,.15),0 4px 0 rgba(59,42,32,.08)}
.cell{background:var(--cell);border-radius:10px;display:grid;place-items:center;position:relative;container-type:size;transition:transform .12s}
.cell:nth-child(odd){background:var(--cell2)}
.cell .it{font-size:min(62cqw,40px);line-height:1;transition:transform .12s;pointer-events:none}
.cell.gen{background:linear-gradient(160deg,#FFE3B3,#F7C98B)}
.cell.gen::after{content:"⚡";position:absolute;right:2px;top:1px;font-size:10px}
.cell .tier{position:absolute;left:3px;bottom:1px;font-size:9px;color:var(--muted);font-weight:600;pointer-events:none}
.cell.sel{box-shadow:0 0 0 3px var(--blue) inset}
.cell.want{box-shadow:0 0 0 2px var(--green) inset}
.cell.hover{box-shadow:0 0 0 3px var(--gold) inset;transform:scale(1.06)}
.cell.match{box-shadow:0 0 0 3px #7BD389 inset;background:#E9F8EC}
.cell.dragging .it{opacity:.25}
.cell.incoming .it{opacity:0}
.cell.pulse{animation:pulse 1s infinite}
.cell.pop .it{animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.cell.squash .it{animation:squash .25s}
.cell.hintw .it{animation:wiggle .5s 3}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes squash{40%{transform:scale(1.2,.8)}70%{transform:scale(.9,1.12)}}
@keyframes wiggle{25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,85,61,.7) inset}50%{box-shadow:0 0 0 4px rgba(200,85,61,.9) inset}}
#info{min-height:24px;text-align:center;font-size:13px;color:var(--muted);margin:6px 0 4px}
#bottom{display:flex;gap:6px}
#bottom>*{flex:1;background:#fff;border-radius:var(--r);padding:6px 0;display:flex;flex-direction:column;align-items:center;font-size:22px;box-shadow:0 3px 0 rgba(59,42,32,.12);position:relative}
#bottom>*:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,32,.12)}
#bottom span{font-size:11px;color:var(--muted);margin-top:1px}
#trash{background:#F3E4D6 !important}
#trash.hover{background:#F4C7BC !important;transform:scale(1.08)}
#trash.hintw{animation:wiggle .5s 3}
.dot{position:absolute;top:4px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
#ghost{position:fixed;pointer-events:none;font-size:50px;transform:translate(-50%,-60%) scale(1.1);z-index:50;display:none;filter:drop-shadow(0 8px 8px rgba(0,0,0,.25))}
.flyitem{position:fixed;left:0;top:0;font-size:34px;z-index:52;pointer-events:none;will-change:transform}
.flyitem.small{font-size:20px}
.float{position:fixed;transform:translate(-50%,-50%);font-weight:700;color:#fff;font-size:18px;pointer-events:none;z-index:58;white-space:nowrap;
  text-shadow:0 2px 0 var(--accent),0 0 8px rgba(0,0,0,.25);animation:floatUp 1.1s ease-out forwards}
.float.xp{text-shadow:0 2px 0 var(--blue),0 0 8px rgba(0,0,0,.25)}
.float.word{font-size:40px;color:#FFE27A;-webkit-text-stroke:1.5px #C8553D;text-shadow:0 4px 0 #C8553D,0 8px 18px rgba(0,0,0,.3);animation:wordPop 1.3s forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-230%) scale(1)}}
@keyframes wordPop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.3) rotate(4deg);opacity:1}45%{transform:translate(-50%,-50%) scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%) scale(1.05)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:57}
#hand{position:fixed;left:0;top:0;font-size:40px;z-index:44;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
#hand[hidden]{display:none}
#hand.tap{animation:handTap 1s infinite}
#hand.drag{animation:handDrag 1.8s infinite ease-in-out}
@keyframes handTap{0%,100%{transform:translate(calc(var(--x0) - 14px),calc(var(--y0) + 2px)) scale(1)}50%{transform:translate(calc(var(--x0) - 14px),calc(var(--y0) + 14px)) scale(.88)}}
@keyframes handDrag{0%{transform:translate(calc(var(--x0) - 14px),calc(var(--y0) + 2px));opacity:0}15%{transform:translate(calc(var(--x0) - 14px),calc(var(--y0) + 2px)) scale(.9);opacity:1}70%{transform:translate(calc(var(--x1) - 14px),calc(var(--y1) + 2px)) scale(.9);opacity:1}85%,100%{transform:translate(calc(var(--x1) - 14px),calc(var(--y1) + 2px));opacity:0}}
#modal{position:fixed;inset:0;background:rgba(40,25,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
#modal[hidden]{display:none}
.sheet{background:var(--bg1);width:100%;max-width:520px;max-height:82vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);position:relative;animation:up .3s cubic-bezier(.3,1.3,.5,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#modalClose{position:absolute;right:12px;top:10px;background:#fff;border-radius:50%;width:32px;height:32px;font-size:15px}
.sheet h2{margin:0 0 12px;font-size:22px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:var(--r);padding:10px;margin-bottom:8px}
.row .tx{flex:1;font-size:14px}
.row .tx small{display:block;color:var(--muted);font-size:12px}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.g{background:var(--green)} .btn.b{background:var(--blue)}
.btn.big{font-size:20px;padding:14px 34px;border-radius:16px}
.btn:disabled{background:#D8CBBB;box-shadow:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.days div{background:#fff;border-radius:10px;padding:6px 2px;text-align:center;font-size:11px}
.days div b{display:block;font-size:20px}
.days div.done{background:#DCEEDD}
.days div.today{outline:3px solid var(--gold);animation:readyPulse 1.2s infinite}
.big{text-align:center;font-size:64px;margin:6px 0}
.center{text-align:center}
.chain{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:24px;margin:8px 0}
.chain span.lock{filter:grayscale(1) brightness(.3);opacity:.35}
.chain span.cur{transform:scale(1.35);filter:drop-shadow(0 0 6px gold)}
#ov{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:rgba(40,22,12,.62);animation:fadeIn .25s;overflow:hidden}
#ov[hidden]{display:none}

.ovc{position:relative;text-align:center;color:#fff;padding:20px;max-width:360px;width:100%}
.ovc h2{font-size:42px;margin:6px 0;color:#FFE27A;-webkit-text-stroke:1.5px #A8432E;text-shadow:0 4px 0 #A8432E;animation:wordPop2 .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes wordPop2{from{transform:scale(.2) rotate(-8deg);opacity:0}}
.lvbadge{width:110px;height:110px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFB199,#C8553D);display:grid;place-items:center;font-size:52px;font-weight:700;color:#fff;
  box-shadow:0 0 0 6px #FFE27A,0 10px 30px rgba(0,0,0,.4);animation:badgeIn .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes badgeIn{from{transform:scale(0) rotate(-180deg)}}
.rank{font-size:18px;margin:4px 0 12px;opacity:.95}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}

/* =====================================================================
   v1.5 · CANDY-GLANZ — Designsystem (kommt NACH allem anderen CSS und überschreibt es)
   Regeln: Kante oben hell, Kante unten dunkel (3D-Lippe), dicke Schrift mit Kontur,
   gesättigte Farben, Rahmen dunkel / Kacheln hell. Keine backdrop-filter, keine
   animierten Schatten (Performance auf Mittelklasse-Handys).
   ===================================================================== */
:root{
  --bolt:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23FFF7A0%22/%3E%3Cstop offset=%22.55%22 stop-color=%22%23FFD21F%22/%3E%3Cstop offset=%221%22 stop-color=%22%23FF9A0A%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d=%22M38 4L12 37H28L22 60L53 23H36Z%22 fill=%22url(%23g)%22 stroke=%22%23B8650A%22 stroke-width=%224%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E");
  --ink:#4A2A1A; --muted:#8C6A52; --ol:#6A2F12;
  --num:"Lilita One",Fredoka,ui-rounded,system-ui,sans-serif;
  --fr1:#2B5C8A; --fr2:#1B4068;
  --accent:#F58A1F; --green:#35B34D; --gold:#FFB72B; --blue:#3F8DEA;
}
html,body{font-weight:500}
b,strong{font-weight:700}
svg.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em;flex:none}
svg.ic.l{width:26px;height:26px}
.otx{-webkit-text-stroke:var(--sw,6px) var(--oc,var(--ol));paint-order:stroke fill;text-shadow:0 var(--sh,3px) 0 var(--oc,var(--ol))}

/* ---------- Szene: weiche Vignette für mehr Tiefe ---------- */
#scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 42%,rgba(255,255,255,0),rgba(40,14,50,.22))}

/* ---------- Kopfzeile: Café-Leiste ---------- */
#brand{background:linear-gradient(#fff,#FFF0D3);box-shadow:0 3px 0 #DDA553,0 7px 10px rgba(60,30,10,.2),inset 0 2px 0 #fff;margin:0 1px 9px;padding:3px 5px 3px 9px;font-size:13px}
#brand b{color:var(--ink);font-weight:700}
#brand .rk{color:var(--muted);font-weight:500}
#brand .ch{background:linear-gradient(#8E5A3B,#6B3C22);color:#fff;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.45);box-shadow:inset 0 2px 3px rgba(0,0,0,.4),0 0 0 2px #FFF0D3,0 3px 0 #DDA553;padding:3px 10px}
#brand .ch .pg{background:linear-gradient(#FFD36A,#F58A1F);box-shadow:inset 0 2px 0 rgba(255,255,255,.55)}
#brand .ch span{z-index:1;text-shadow:0 1px 0 rgba(90,40,0,.7)}

/* ---------- HUD: Level-Rosette, XP-Balken, Währungs-Pillen ---------- */
#top{gap:4px;align-items:center;margin:0 0 5px;min-height:46px}
.lvl{flex:none;display:flex;align-items:center;padding:0;background:none;box-shadow:none;border-radius:0;position:relative;z-index:2;margin:-4px 3px -4px 0}
.lvlnum{position:relative;width:54px;height:54px;display:grid;place-items:center;flex:none;z-index:2}
.lvlnum .ros{position:absolute;left:8px;top:7px;width:38px;height:38px;filter:drop-shadow(0 3px 0 rgba(110,45,0,.38))}
.xpring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible;filter:drop-shadow(0 3px 0 #DDA553)}
.xpring circle{fill:none}
.xpring .xo{stroke:#FFF0D3;stroke-width:10}
.xpring .xt{stroke:#3A2A5E;stroke-width:6}
.xpring .xf{stroke:#52C8FF;stroke-width:6;stroke-linecap:round;stroke-dasharray:0 100;transition:stroke-dasharray .6s cubic-bezier(.3,1.2,.5,1),opacity .2s}
.lvlnum b{position:relative;font:400 19px/1 var(--num);color:#fff;-webkit-text-stroke:4px #A8360F;paint-order:stroke fill;text-shadow:0 2px 0 #A8360F;margin-top:-1px}
.res{position:relative;flex:1 1 0;min-width:0;height:33px;margin-left:13px;padding:0 5px 0 26px;gap:3px;border-radius:999px;background:linear-gradient(#FFFFFF,#FFECC6);box-shadow:0 3px 0 #D9A24D,0 6px 8px rgba(60,30,10,.22),inset 0 2px 0 #fff;display:flex;align-items:center;white-space:nowrap}
.res .rico{position:absolute;left:-14px;top:50%;width:37px;height:37px;margin-top:-19px;filter:drop-shadow(0 2px 0 rgba(95,45,5,.38));pointer-events:none}
.res .rico svg{width:100%;height:100%;display:block}
.res .rv{display:flex;flex-direction:column;justify-content:center;line-height:1;min-width:0;flex:1}
.res b{font:400 clamp(15px,4.4vw,18px)/1 var(--num);color:var(--ink);letter-spacing:.2px}
.res small{font:700 9px/1 Fredoka,sans-serif;color:var(--muted);margin:2px 0 0;min-height:0}
.res small:empty{display:none}
.res .plus{flex:none;width:19px;height:19px;border-radius:50%;background:linear-gradient(#A6F596,#35B34D);box-shadow:0 2px 0 #1E7F34,inset 0 1px 0 rgba(255,255,255,.75);color:#fff;font:700 16px/18px Fredoka,sans-serif;text-align:center;font-style:normal;text-shadow:0 1px 0 rgba(10,80,30,.6)}
.res.low .plus{animation:plusPulse 1.1s ease-in-out infinite}
@keyframes plusPulse{50%{transform:scale(1.25)}}
.res.bump{animation:bump .35s}
#resEnergy,#resGems,#resCoins{cursor:pointer}

/* ---------- Hinweise ---------- */
#hint{color:#fff;font-weight:600;text-shadow:0 1px 0 rgba(90,30,0,.6)}
#hint:not(:empty),#info:not(:empty){background:linear-gradient(#6B3A22,#4A2514);color:#fff;border-radius:14px;padding:5px 12px;box-shadow:0 3px 0 #2B140A,0 6px 10px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.16);font-weight:600;font-size:13px}
#info{color:#FFE9C2}

/* ---------- Gäste-Tresen ---------- */
#orders{border-radius:20px;box-shadow:0 4px 0 #A56A32,0 9px 14px rgba(40,18,6,.28),inset 0 0 0 3px rgba(255,255,255,.75)}
.awn{height:10px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.bub{border:2px solid rgba(106,47,18,.14);box-shadow:0 3px 0 rgba(106,47,18,.22),inset 0 2px 0 #fff;border-radius:14px}
.rq{background:linear-gradient(#fff,#FFF0D8);border-radius:9px;box-shadow:inset 0 -2px 0 rgba(106,47,18,.1)}
.rw b{display:flex;align-items:center;justify-content:flex-end;gap:2px;font:400 15px/1 var(--num);color:var(--ink)}
.rw b svg{width:17px;height:17px}
.rw small{font-weight:700;color:#4B9A3A}
.plate{height:28px;background:linear-gradient(#F0C48C 0 3px,#C98E55 3px 4px,#A8692F 4px);box-shadow:inset 0 -3px 0 rgba(60,25,5,.3)}
.plate button{top:5px;height:19px;line-height:19px;border-radius:10px;font:600 12px/19px Fredoka,sans-serif;background:rgba(255,255,255,.18);color:rgba(255,255,255,.7);box-shadow:inset 0 2px 2px rgba(60,25,5,.35)}
.plate button svg{width:13px;height:13px;vertical-align:-2px}
.order.ready .plate button{background:linear-gradient(#A6F596,#35B34D);color:#fff;box-shadow:0 3px 0 #1E7F34,inset 0 2px 0 rgba(255,255,255,.7);text-shadow:0 1px 0 rgba(10,80,30,.7);font-weight:700}
.order.ready .bub{background:linear-gradient(#F3FFF0,#D9F7D2);border-color:#35B34D}

/* ---------- Brett: dunkler Rahmen, helle Kacheln ---------- */
#board{position:relative;gap:5px;padding:10px;border-radius:26px;--hole:rgba(0,0,0,.2);--hole2:rgba(0,0,0,.27);--holesh:inset 0 3px 5px rgba(0,0,0,.4),inset 0 -2px 0 rgba(255,255,255,.2);
  background:radial-gradient(circle at 7px 7px,rgba(255,255,255,.16) 1.4px,rgba(255,255,255,0) 2px) 0 0/16px 16px,linear-gradient(170deg,var(--fr1),var(--fr2));
  box-shadow:0 7px 0 rgba(0,0,0,.34),0 18px 26px rgba(10,4,24,.42),inset 0 4px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(0,0,0,.22),inset 0 0 0 3px rgba(255,255,255,.16)}
#board::before{content:"";position:absolute;left:7%;right:7%;top:3px;height:15px;border-radius:12px 12px 50% 50%/12px 12px 15px 15px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none}
/* ---------- Brett mit Bild-Rahmen: art/frame.webp (Masse: scripts/art_import.py FR_*; 1000x1123, Dicke 6,8 %, Schattenrand 3 % / 1,425 % / 4,63 %) ---------- */
#boardWrap{container-type:size}
#board{--bw:min(100cqw,calc(min(100cqh,47dvh) * 1000 / 1123));--ft:calc(var(--bw) * .068);box-sizing:border-box;width:var(--bw);aspect-ratio:1000/1123;padding:calc(var(--ft) + 4px);gap:4px;border-radius:0;background:none;box-shadow:none;isolation:isolate}
#board::before{content:"";position:absolute;inset:calc(var(--ft) - 3px);height:auto;border-radius:calc(var(--bw) * .065);z-index:-1;pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,0) 16%),radial-gradient(circle at 7px 7px,rgba(255,255,255,.14) 1.4px,rgba(255,255,255,0) 2px) 0 0/16px 16px,linear-gradient(170deg,var(--fr1),var(--fr2));
  box-shadow:inset 0 4px 9px rgba(0,0,0,.45),inset 0 -2px 0 rgba(255,255,255,.14)}
#board::after{content:"";position:absolute;inset:-1.425% -3% -4.63% -3%;z-index:6;pointer-events:none;background:var(--frimg,url(art/frame.webp)) 0 0/100% 100% no-repeat}
.sc-floor{position:absolute;display:block;object-fit:cover;pointer-events:none;-webkit-user-drag:none;user-select:none}
.cell,.cell:nth-child(odd){background:var(--hole);border-radius:12px;box-shadow:var(--holesh)}
.cell:nth-child(even){background:var(--hole2)}
.cell .it{font-size:min(60cqw,38px);text-shadow:0 2px 2px rgba(60,25,5,.35)}
.cell[data-t]{--t1:#FFFFFF;--t2:#F0E2CC;--tr:#C4A982;background:radial-gradient(120% 105% at 28% 12%,var(--t1),var(--t2));box-shadow:0 3px 0 var(--tr),0 6px 7px rgba(18,6,2,.34),inset 0 2px 0 rgba(255,255,255,.85),inset 0 -3px 5px rgba(0,0,0,.07)}
.cell[data-t="1"]{--t1:#EBFCE3;--t2:#92DD88;--tr:#4DA854}
.cell[data-t="2"]{--t1:#E6F5FF;--t2:#80BFF5;--tr:#3C86D6}
.cell[data-t="3"]{--t1:#F4EAFF;--t2:#B796F5;--tr:#7752D4}
.cell[data-t="4"]{--t1:#FFEAF1;--t2:#FF96B7;--tr:#DE4D7C}
.cell[data-t="5"]{--t1:#FFEFCF;--t2:#FFB353;--tr:#E5841A}
.cell[data-t="6"]{--t1:#FFF8C6;--t2:#FFCE48;--tr:#DD9E0A}
.cell[data-t="7"]{--t1:#FFFFFF;--t2:#A8F1FF;--tr:#38BDE6}
/* ---------- Teile mit Bild: stehen frei im Feld, ohne Platte (der Schatten ist im Bild), die Stufe gibt einen weichen Farbschein ---------- */
img.art{display:block;width:1.15em;height:1.15em;object-fit:contain;pointer-events:none;-webkit-user-drag:none;user-select:none}
.cell .it img.art{width:100%;height:100%}
.cell.art .it{display:block;position:relative;z-index:1;width:96%;height:96%}
.cell.art[data-t]{background:var(--hole);box-shadow:var(--holesh)}
.cell.art[data-t]:nth-child(even){background:var(--hole2)}
.cell.art::after{content:"";position:absolute;left:6%;right:6%;top:10%;bottom:4%;border-radius:50%;background:radial-gradient(closest-side,var(--t2),rgba(255,255,255,0));opacity:.45;pointer-events:none}
.cell.art .tier{z-index:2;left:3px;bottom:2px;min-width:15px;height:15px;border-radius:8px;background:radial-gradient(120% 120% at 30% 15%,var(--t1),var(--t2));color:#4A2A1A;font:700 10px/15px Fredoka,sans-serif;box-shadow:0 0 0 1.5px var(--tr),0 2px 2px rgba(0,0,0,.35)}
.cell.art.sel{box-shadow:0 0 0 3px #4DB6FF,0 0 12px 3px rgba(77,182,255,.7)}
.cell.art.hover{box-shadow:0 0 16px 4px rgba(255,226,122,.85)}
.cell.art.match{box-shadow:0 0 14px 3px rgba(123,227,142,.9)}
.cell.gen .it img.art{width:92%;height:92%;margin:auto}
#ghost .gt.art{background:none;box-shadow:none;width:76px;height:76px;filter:drop-shadow(0 8px 6px rgba(10,0,40,.35))}
.flyitem img.art{width:1.15em;height:1.15em}
.rq img.art{width:100%;height:100%}
.oq .oe img.art{width:1.15em;height:1.15em;margin:0 auto}
.disc-em img.art{width:1em;height:1em;margin:0 auto}
#discChip .dc-e img.art{width:100%;height:100%}
.chain span img.art{width:1em;height:1em}
.cell .tier{left:4px;bottom:3px;min-width:13px;height:13px;padding:0 3px;border-radius:7px;background:rgba(74,42,26,.55);color:#fff;font:700 9px/13px Fredoka,sans-serif;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.cell.gen{background:radial-gradient(120% 105% at 28% 12%,#FFF6CF,#FFC24A);box-shadow:0 3px 0 #C9830E,0 6px 9px rgba(18,6,2,.4),inset 0 2px 0 rgba(255,255,255,.9),inset 0 0 0 2px rgba(255,255,255,.5)}
.cell.gen::after{content:"";right:1px;top:1px;width:15px;height:15px;font-size:0;background:var(--bolt) center/contain no-repeat;filter:drop-shadow(0 1px 0 rgba(150,70,0,.5))}
.cell.top{overflow:hidden}
.cell.top::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%);transform:translateX(-130%);animation:shine 2.8s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.cell.sel{box-shadow:0 3px 0 var(--tr,#000),0 0 0 3px #4DB6FF,0 0 12px 3px rgba(77,182,255,.7)}
.cell.want{outline:3px solid #44D45E;outline-offset:-3px}
.cell.hover{transform:scale(1.07);outline:3px solid #FFE27A;outline-offset:-3px;box-shadow:0 0 16px 4px rgba(255,226,122,.85)}
.cell.match{outline:3px solid #7BE38E;outline-offset:-3px;box-shadow:0 0 14px 3px rgba(123,227,142,.9)}
.cell.dragging,.cell.incoming{background:rgba(0,0,0,.24)!important;box-shadow:inset 0 3px 5px rgba(0,0,0,.38)!important}
.cell.dragging .tier,.cell.incoming .tier{opacity:0}
.cell.pulse{animation:none;outline:3px solid #fff;animation:pulseO 1s infinite}
@keyframes pulseO{50%{outline-color:#FFE27A;transform:scale(1.07)}}
#ghost{left:0;top:0;font-size:46px;transform:translate3d(-200px,-200px,0);will-change:transform;filter:none}
#ghost .gt{display:grid;place-items:center;width:64px;height:64px;border-radius:16px;background:radial-gradient(120% 105% at 28% 12%,var(--t1),var(--t2));box-shadow:0 5px 0 var(--tr),0 14px 16px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.85)}

/* ---------- Untere Leiste: Candy-Buttons ---------- */
#bottom{gap:7px;margin-top:8px}
#bottom>*,#bottom>button{flex:1;position:relative;border-radius:17px;padding:6px 0 5px;color:#fff;overflow:hidden;gap:1px;
  background:linear-gradient(var(--b1),var(--b2));box-shadow:0 4px 0 var(--bl),0 8px 10px rgba(30,12,4,.3),inset 0 2px 0 rgba(255,255,255,.6)}
#bottom>*::after{content:"";position:absolute;left:10%;right:10%;top:3px;height:34%;border-radius:12px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none}
#bottom svg{width:29px;height:29px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.28));position:relative;z-index:1}
#bottom span{position:relative;z-index:1;font:700 11px/1.1 Fredoka,sans-serif;color:#fff;margin-top:1px;text-shadow:0 1px 0 var(--bl),0 0 3px var(--bl)}
#bottom>*:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bl),0 3px 5px rgba(30,12,4,.3),inset 0 2px 0 rgba(255,255,255,.5)}
#bottom .shop{--b1:#8CEB7A;--b2:#33B24A;--bl:#1B7A32}
#bottom .up{--b1:#8ED6FF;--b2:#3F8DEA;--bl:#1F55B0}
#bottom #trash{--b1:#FF9B86;--b2:#E2503F;--bl:#9A2619;background:linear-gradient(var(--b1),var(--b2))!important}
#bottom .day{--b1:#FFD76E;--b2:#FF9A1F;--bl:#B8600A}
#bottom .set{--b1:#CBA8FF;--b2:#8A5CE6;--bl:#4F2C9E}
#trash.hover{transform:scale(1.1);background:linear-gradient(#FFC2B5,#FF6B57)!important}
.dot{top:3px;right:9px;width:14px;height:14px;background:#FF3D5A;border:2px solid #fff;box-shadow:0 2px 3px rgba(0,0,0,.35);z-index:2}
#dailyBtn svg{animation:giftWob 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes giftWob{0%,70%,100%{transform:none}78%{transform:rotate(-9deg) scale(1.08)}86%{transform:rotate(8deg) scale(1.08)}94%{transform:rotate(-4deg)}}

/* ---------- Hinweis-Pillen & Toast ---------- */
#toast{background:linear-gradient(#6B3A22,#4A2514);color:#fff;border-radius:16px;padding:10px 16px;font-weight:600;box-shadow:0 4px 0 #2B140A,0 9px 16px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.16)}
.float{font-family:var(--num);font-weight:400;font-size:21px;-webkit-text-stroke:5px #6A2F12;paint-order:stroke fill;text-shadow:0 3px 0 #6A2F12;letter-spacing:.3px}
.float.xp{-webkit-text-stroke:5px #1F55B0;text-shadow:0 3px 0 #1F55B0}
.float.word{font-size:44px;color:#FFE97A;-webkit-text-stroke:10px #8A2E10;text-shadow:0 6px 0 #8A2E10,0 12px 20px rgba(0,0,0,.35)}

/* ---------- Buttons ---------- */
.btn{position:relative;overflow:hidden;font:400 16px/1 var(--num);letter-spacing:.3px;padding:11px 15px 10px;border-radius:15px;color:#fff;
  background:linear-gradient(#FFCB6B,#F58A1F);box-shadow:0 4px 0 #B3560A,0 8px 10px rgba(60,28,6,.28),inset 0 2px 0 rgba(255,255,255,.65);text-shadow:0 2px 0 rgba(130,55,0,.6);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn::after{content:"";position:absolute;left:9%;right:9%;top:3px;height:38%;border-radius:11px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #B3560A,0 3px 5px rgba(60,28,6,.28),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.g{background:linear-gradient(#A6F596,#35B34D);box-shadow:0 4px 0 #1B7A32,0 8px 10px rgba(10,60,20,.28),inset 0 2px 0 rgba(255,255,255,.65);text-shadow:0 2px 0 rgba(8,80,30,.6)}
.btn.g:active{box-shadow:0 1px 0 #1B7A32,0 3px 5px rgba(10,60,20,.28),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.b{background:linear-gradient(#9ADBFF,#3F8DEA);box-shadow:0 4px 0 #1F55B0,0 8px 10px rgba(10,30,80,.28),inset 0 2px 0 rgba(255,255,255,.65);text-shadow:0 2px 0 rgba(20,50,130,.6)}
.btn.p{background:linear-gradient(#D6B8FF,#8657E6);box-shadow:0 4px 0 #4F2A9E,0 8px 10px rgba(40,10,90,.28),inset 0 2px 0 rgba(255,255,255,.65);text-shadow:0 2px 0 rgba(60,20,130,.6)}
.btn.big{font-size:24px;padding:16px 40px 15px;border-radius:22px;box-shadow:0 6px 0 #1B7A32,0 12px 18px rgba(10,60,20,.32),inset 0 2px 0 rgba(255,255,255,.65)}
.btn.big:not(.g){box-shadow:0 6px 0 #B3560A,0 12px 18px rgba(60,28,6,.3),inset 0 2px 0 rgba(255,255,255,.65)}
.btn.sm{font-size:14px;padding:9px 12px 8px}
.btn:disabled{background:linear-gradient(#EADFD2,#C9BBAA);box-shadow:0 4px 0 #A8957F,inset 0 2px 0 rgba(255,255,255,.6);color:#9A8A78;text-shadow:none;cursor:default}
.btn svg.ic{width:1.2em;height:1.2em;vertical-align:-.25em}

/* ---------- Sheets (Shop, Ausbau, Bonus, Optionen) ---------- */
#modal{background:rgba(35,14,10,.55)}
.sheet{background:linear-gradient(#FFFBF1,#FFEDCB);border-radius:30px 30px 0 0;padding:0 14px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -4px 0 #C98E4B,0 -10px 24px rgba(30,12,4,.3)}
.sheet h2{margin:0 -14px 14px;padding:15px 64px 12px 20px;font:400 27px/1.05 var(--num);color:#fff;letter-spacing:.4px;background:linear-gradient(#A8683B,#7A4424);border-radius:30px 30px 0 0;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.2);text-shadow:0 3px 0 rgba(60,25,5,.65);display:flex;align-items:center;gap:9px}

.row{background:linear-gradient(#fff,#FFF6E6);border-radius:18px;padding:10px 11px;box-shadow:0 3px 0 #E6C98F,inset 0 2px 0 #fff;gap:11px;margin-bottom:10px}

.days{gap:6px}
.days div{background:linear-gradient(#fff,#FFF3DC);border-radius:13px;padding:7px 2px 5px;font:700 11px/1.1 Fredoka,sans-serif;color:var(--muted);box-shadow:0 3px 0 #E6C98F}
.days div b{font:400 18px/1.15 var(--num);color:var(--ink)}

.card{background:linear-gradient(#FFFDF4,#FFEBC7);border-radius:26px;box-shadow:0 7px 0 #C98E4B,0 22px 44px rgba(0,0,0,.45),inset 0 3px 0 #fff}

.card .dtitle{font:400 20px/1 var(--num);color:#E2503F;letter-spacing:1px}
.card .dname{font:400 28px/1.1 var(--num);color:var(--ink)}
.pc-lv{background:linear-gradient(#fff,#FFEBC4);box-shadow:0 3px 0 #D9A24D;font:400 16px/1 var(--num);padding:6px 16px 5px}
.pot-t b{font:400 26px/1 var(--num);color:#FFE97A;-webkit-text-stroke:6px #7A2A10;paint-order:stroke fill;text-shadow:0 3px 0 #7A2A10}
.pot-t b svg{width:26px;height:26px;vertical-align:-5px}
.pot-t small{font-weight:700}
.chapter{background:linear-gradient(#fff,#FFF1D6);box-shadow:0 4px 0 #D9A24D}

/* ---------- Eingabe / Onboarding ---------- */
.onb input{border:3px solid #E6C98F;border-radius:15px;background:#fff;box-shadow:inset 0 3px 4px rgba(120,70,20,.15);font-weight:600}
.onb input:focus{border-color:#F58A1F}
.onb label{font-family:var(--num);font-weight:400;font-size:17px;color:var(--ink)}
.sug button{background:linear-gradient(#fff,#FFF1D6);box-shadow:0 3px 0 #E6C98F;font-weight:600}
.avs button{background:linear-gradient(#fff,#FFF1D6);box-shadow:0 3px 0 #E6C98F,inset 0 2px 0 #fff;border-radius:16px}
.avs button.on{outline:3px solid #F58A1F;box-shadow:0 3px 0 #E6C98F,0 0 12px rgba(245,138,31,.6)}

/* ---------- Welt-Karte ---------- */
.wcard .here{background:linear-gradient(#FFCB6B,#F58A1F);font-family:var(--num);font-weight:400;font-size:12px;text-shadow:0 1px 0 rgba(130,55,0,.6);box-shadow:0 2px 0 #B3560A}

/* ---------- Startbildschirm (leicht: Verlauf + Funkeln, nur Compositor-Animationen) ---------- */
#splash{background:radial-gradient(130% 95% at 50% 24%,#FFE08A 0,#FF9A5A 40%,#E2446F 72%,#6B2A8E 100%)}
#splash::before{background:radial-gradient(100% 70% at 50% 100%,rgba(70,15,90,.55),rgba(70,15,90,0) 70%)}
#splash .rays{width:132vw;height:132vw;left:50%;top:34%;margin:-66vw 0 0 -66vw;opacity:.5;animation-duration:30s}
#splash .bk{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#splash .bk i{position:absolute;bottom:-30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),rgba(255,236,170,.25) 60%,rgba(255,236,170,0) 72%);animation:bokeh var(--d,14s) linear infinite;animation-delay:var(--l,0s);opacity:0;will-change:transform,opacity}
@keyframes bokeh{0%{transform:translateY(0) scale(.7);opacity:0}12%{opacity:.9}100%{transform:translateY(-112vh) scale(1.15);opacity:0}}
.sp-logo{filter:none;will-change:transform}
.sp-hero .steam-a,.sp-hero .spk-a>*{animation:none}
.sp-title{font:400 clamp(54px,17vw,72px)/1 var(--num);color:#FFF6D8;-webkit-text-stroke:12px #8E1F4A;paint-order:stroke fill;text-shadow:0 7px 0 #8E1F4A,0 13px 0 rgba(90,10,50,.4);letter-spacing:1px;margin-top:4px}
.sp-title .ln{display:block;animation:none;text-align:center;white-space:nowrap}
.sp-title .ln2{font-size:.74em;-webkit-text-stroke-width:9px;margin-top:.02em}
#spWelcome{font-weight:600;text-shadow:0 2px 0 rgba(90,10,50,.55)}
#spPlay{font:400 28px/1 var(--num);letter-spacing:.8px;background:linear-gradient(#B5F8A4,#35B34D);box-shadow:0 7px 0 #1B7A32,0 14px 22px rgba(20,60,20,.35),inset 0 3px 0 rgba(255,255,255,.7);text-shadow:0 3px 0 rgba(8,80,30,.65);padding:18px 64px 17px;border-radius:26px;position:relative;overflow:hidden;animation:none}
#spPlay::before{content:"";position:absolute;top:0;bottom:0;left:0;width:38%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-160%) skewX(-18deg);animation:sweep 2.8s ease-in-out infinite;will-change:transform}
@keyframes sweep{0%,55%{transform:translateX(-160%) skewX(-18deg)}100%{transform:translateX(380%) skewX(-18deg)}}
#spPlay:active{transform:translateY(4px);box-shadow:0 2px 0 #1B7A32,inset 0 3px 0 rgba(255,255,255,.6)}
#splash.out{opacity:0;transform:none;transition:opacity .3s ease-out}
.sp-pips{display:flex;gap:8px;margin:12px 0 2px;align-items:center;min-height:20px}
.sp-pips i{width:12px;height:12px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 3px 0 rgba(90,10,50,.35)}
.sp-pips i.off{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);box-shadow:none}
.sp-pips i.cur{width:19px;height:19px;border-width:4px;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 4px 0 rgba(90,10,50,.35)}

/* ---------- Bewegung reduzieren ---------- */
@media (prefers-reduced-motion:reduce){.cell.top::before,#spPlay::before,#splash .bk i,#dailyBtn svg,.res.low .plus{animation:none!important}}

/* Unter dem Splash ruhen die Endlos-Animationen (per Calm.lock, kein Klassen-Schalter auf body: der kostet eine Neuberechnung der ganzen Seite) */
.dot{animation:dotPulse 1s ease-in-out infinite}
@keyframes dotPulse{50%{transform:scale(1.45);opacity:.65}}

/* ---------- Auftragskarte: Belohnung rutscht unter die Sprechblase ---------- */
.rw{bottom:31px}
#orders.c4 .rw,#orders.c5 .rw{display:none}

/* ---------- XP-Leiste: heller, klarer ---------- */

/* ---------- Kleine Bausteine in Fenstern ---------- */
.sheet h3.first{margin-top:4px}
.sheet h3 .what{width:26px;height:26px;padding:0;margin-left:4px;vertical-align:-6px;background:none}
.sheet h3 .what svg{width:26px;height:26px}
.row .tx small svg.ic{width:14px;height:14px;vertical-align:-2px}
.row .tx .pips{display:flex;gap:3px;margin-top:3px}
.row .tx .pips i{width:15px;height:7px;border-radius:4px;background:#E6D3B3;box-shadow:inset 0 1px 1px rgba(0,0,0,.18)}
.row .tx .pips i.on{background:linear-gradient(#9BF08A,#34B24C);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.row .mi.av{font-size:30px}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(#fff,#FFF3DC);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 #E6C98F,inset 0 2px 0 #fff;margin-bottom:12px}
.hero .hi{width:62px;height:62px;flex:none;display:grid;place-items:center;border-radius:20px;background:radial-gradient(120% 110% at 30% 15%,#fff,#CFEFFF);box-shadow:inset 0 -4px 0 rgba(30,100,170,.22),inset 0 2px 0 #fff}
.hero .hi svg{width:44px;height:44px;filter:drop-shadow(0 3px 0 rgba(30,60,130,.3))}
.hero p{margin:0;font:600 14px/1.35 Fredoka,sans-serif;color:var(--ink)}
.hero p .big{font:400 30px/1 var(--num);color:#1F55B0}
.mini{margin:10px 2px 0;text-align:center;font:600 12.5px/1.4 Fredoka,sans-serif;color:var(--muted)}
.mini svg.ic{width:14px;height:14px;vertical-align:-2px}
.lead{margin:-4px 2px 12px;font:600 14px/1.35 Fredoka,sans-serif;color:var(--ink);text-align:center}
.lnk{background:none;padding:0;font:700 12.5px/1.4 Fredoka,sans-serif;color:#1F55B0;text-decoration:underline}
.gr{font-family:var(--num);font-weight:400}
.gr svg.ic{width:1.1em;height:1.1em}
.tip{margin:10px 18px 0;font:700 14px/1.35 Fredoka,sans-serif;color:#FFEFD0;text-shadow:0 2px 0 rgba(60,20,0,.55);opacity:0;animation:chipIn .5s 1.6s ease-out forwards}
.oreq{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}
.oq{position:relative;width:108px;padding:12px 6px 9px;border-radius:18px;text-align:center;background:linear-gradient(#fff,#FFF1D6);box-shadow:0 4px 0 #E6C98F,inset 0 2px 0 #fff}
.oq.ok{background:linear-gradient(#F3FFF0,#D9F7D2);box-shadow:0 4px 0 #9BD890,inset 0 2px 0 #fff}
.oq .oe{display:block;font-size:46px;line-height:1.1;filter:drop-shadow(0 3px 2px rgba(90,40,0,.25))}
.oq b{display:block;font:700 14px/1.2 Fredoka,sans-serif;color:var(--ink);margin-top:4px}
.oq small{display:block;font:600 12px/1.2 Fredoka,sans-serif;color:#2E8B46;margin-top:2px}
.oq .st{position:absolute;right:-7px;top:-7px;width:30px;height:30px}
.oq .st svg{width:30px;height:30px}
.oq em{display:inline-flex;align-items:center;gap:3px;font:400 17px/1 var(--num);font-style:normal;color:#1F55B0;margin-top:6px}
.oq em svg.ic{width:18px;height:18px}

/* ---------- Geschenk ---------- */
.giftbox{font-size:0;display:inline-block;width:150px;height:150px;animation:floaty 1.6s ease-in-out infinite}
.giftbox svg{width:100%;height:100%;filter:drop-shadow(0 10px 0 rgba(90,30,10,.35)) drop-shadow(0 18px 20px rgba(0,0,0,.35))}
.giftbox.hit{animation:giftHit .3s}
#gTxt{margin:6px 0 14px}
#gBtn{display:flex;flex-direction:column;align-items:center;gap:12px}
#gBtn .btn{margin:0!important}
#gTxt .gr{font-size:28px;color:#FFE97A;-webkit-text-stroke:6px #7A2A10;paint-order:stroke fill;text-shadow:0 3px 0 #7A2A10;display:inline-flex;align-items:center;gap:4px}
#gTxt .gr svg.ic{width:30px;height:30px}
#giftFab{position:fixed;right:12px;top:290px;width:var(--fs,58px);height:var(--fs,58px);z-index:39;border-radius:50%;padding:0;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,#FFEEB0,#FFB32C 62%,#E58A0C);box-shadow:0 4px 0 #A85A08,0 9px 14px rgba(40,16,0,.4),inset 0 2px 0 rgba(255,255,255,.75);animation:fabBob 1.9s ease-in-out infinite}
#giftFab[hidden]{display:none}
#giftFab svg{width:66%;height:66%;filter:drop-shadow(0 2px 0 rgba(95,45,5,.35))}
#giftFab b{position:absolute;right:-4px;top:-4px;min-width:23px;height:23px;padding:0 4px;box-sizing:border-box;border-radius:12px;background:#FF3D5A;border:2px solid #fff;color:#fff;font:400 14px/19px var(--num);text-align:center;box-shadow:0 2px 3px rgba(0,0,0,.35)}
#giftFab.pop{animation:fabPop .7s cubic-bezier(.3,1.8,.5,1),fabBob 1.9s .7s ease-in-out infinite}
#giftFab:active{filter:brightness(.95)}
@keyframes fabBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-5deg)}}
@keyframes fabPop{from{transform:scale(0) rotate(-40deg)}}

/* ---------- Level-Banner, Entdeckung, Verdoppeln (nicht blockierend) ---------- */
#lvBanner,#discChip{position:fixed;left:50%;top:300px;z-index:43;pointer-events:none;opacity:0;white-space:nowrap;display:flex;align-items:center;gap:10px;border-radius:999px;
  background:linear-gradient(#FFF9E8,#FFE3A6);box-shadow:0 5px 0 #C98E4B,0 12px 18px rgba(30,12,4,.35),inset 0 2px 0 #fff}
#lvBanner{padding:6px 20px 6px 8px}
#lvBanner.on{animation:bnrIn 3s cubic-bezier(.3,1.5,.5,1) both}
#discChip{padding:6px 14px 6px 8px;gap:9px}
#discChip.on{animation:bnrIn 2.6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes bnrIn{0%{opacity:0;transform:translate(-50%,-14px) scale(.6)}10%{opacity:1;transform:translate(-50%,0) scale(1.07)}17%{transform:translate(-50%,0) scale(1)}86%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px) scale(.96)}}
#lvBanner .lvb-n{position:relative;width:46px;height:46px;display:grid;place-items:center;flex:none}
#lvBanner .lvb-n svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(110,45,0,.4))}
#lvBanner .lvb-n b{position:relative;font:400 21px/1 var(--num);color:#fff;-webkit-text-stroke:5px #A8360F;paint-order:stroke fill;text-shadow:0 2px 0 #A8360F}
#lvBanner .lvb-t,#discChip .dc-t{display:flex;flex-direction:column;line-height:1.05}
#lvBanner .lvb-t b,#discChip .dc-t b{font:400 20px/1 var(--num);color:var(--ink);letter-spacing:.3px}
#lvBanner .lvb-t small{display:flex;align-items:center;gap:4px;font:700 13px/1.2 Fredoka,sans-serif;color:#7A5A3C;margin-top:4px}
#lvBanner .lvb-t small span{display:inline-flex;align-items:center;gap:3px;margin-left:6px}
#lvBanner svg.ic,#discChip svg.ic{width:16px;height:16px}
#discChip .dc-e{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;font-size:28px;background:linear-gradient(#fff,#FFEBC7);box-shadow:inset 0 -3px 0 rgba(180,120,40,.25),0 2px 0 #E0A850}
#discChip .dc-t small{font:700 11px/1 Fredoka,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#E2503F;margin-bottom:3px}
#discChip .dc-n{font:400 14px/1 var(--num);color:var(--muted);background:rgba(120,70,20,.1);border-radius:999px;padding:5px 8px 4px}
#discChip .dc-g{display:inline-flex;align-items:center;gap:3px;font:400 16px/1 var(--num);color:#1F55B0}
#dblChip{position:fixed;left:50%;top:700px;z-index:43;display:flex;align-items:center;gap:9px;padding:5px 16px 5px 7px;border-radius:999px;opacity:0;pointer-events:none;white-space:nowrap;
  background:linear-gradient(#9ADBFF,#3F8DEA);box-shadow:0 4px 0 #1F55B0,0 9px 14px rgba(10,30,80,.35),inset 0 2px 0 rgba(255,255,255,.65);color:#fff}
#dblChip.on{pointer-events:auto;animation:dblIn 7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes dblIn{0%{opacity:0;transform:translate(-50%,16px) scale(.7)}5%{opacity:1;transform:translate(-50%,0) scale(1.06)}8%{transform:translate(-50%,0) scale(1)}92%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,10px) scale(.96)}}
#dblChip .dbl-i{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.35)}
#dblChip .dbl-i svg{width:22px;height:22px}
#dblChip .dbl-t{display:flex;flex-direction:column;text-align:left;line-height:1.05}
#dblChip .dbl-t small{font:700 11px/1 Fredoka,sans-serif;opacity:.95;letter-spacing:.3px}
#dblChip .dbl-t b{display:flex;align-items:center;gap:3px;font:400 17px/1.1 var(--num);text-shadow:0 2px 0 rgba(20,50,130,.6)}
#dblChip .dbl-t svg.ic{width:16px;height:16px}
#dblChip i{font:400 20px/1 var(--num);font-style:normal;text-shadow:0 2px 0 rgba(20,50,130,.6)}

/* ---------- Fliegende Münzen ---------- */
.flyitem svg.ic{width:1em;height:1em;vertical-align:top}
.flyitem.small svg.ic{width:1.35em;height:1.35em}

/* ---------- Figuren (Auswahl, Profilbild) ----------
   Ohne Bild: Emoji im bunten Glanz-Kreis. Mit Bild (.art): die Kachel steht frei, die Kochmuetze ragt oben heraus. */
.avi{display:inline-block;width:1.3em;height:1.3em;object-fit:contain;vertical-align:-.3em;pointer-events:none}
.avbig{width:96px;height:96px;margin:0 auto 2px;border-radius:50%;display:grid;place-items:center;font-size:54px;line-height:1;position:relative;
  background:radial-gradient(circle at 32% 24%,#fff 0,var(--ah,#FFE3AE) 66%);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ah2,#E6C98F),0 8px 14px rgba(120,70,20,.3)}
.avbig .avi{width:92%;height:92%;vertical-align:baseline}
.avbig.art{background:none;box-shadow:none;border-radius:0;filter:drop-shadow(0 6px 7px rgba(90,45,10,.32))}
.avbig.art .avi{width:100%;height:100%}
.avbig.bounce{animation:avPop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes avPop{0%{transform:scale(.7) rotate(-8deg)}60%{transform:scale(1.12) rotate(3deg)}100%{transform:none}}
.avname{font:400 18px/1.1 var(--num);color:#E2503F;margin:0 0 6px;letter-spacing:.5px;min-height:20px}
.avs{grid-template-columns:repeat(6,1fr);gap:7px 6px;margin:4px 0 12px}
.avs button{aspect-ratio:1/1;width:100%;padding:0;border-radius:50%;font-size:24px;line-height:1;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 32% 24%,#fff 0,var(--ah,#FFF1D6) 68%);box-shadow:0 3px 0 var(--ah2,#E6C98F),inset 0 2px 0 rgba(255,255,255,.8)}
.avs button .avi{width:94%;height:94%;vertical-align:baseline}
.avs button.on{outline:3px solid #F58A1F;outline-offset:1px;box-shadow:0 3px 0 var(--ah2,#E6C98F),0 0 12px rgba(245,138,31,.65);transform:scale(1.08)}
.avs button.art{background:none;box-shadow:none;border-radius:0;overflow:visible;outline:0;transition:transform .15s,filter .15s}
.avs button.art .avi{width:100%;height:100%}
.avs button.art.on{transform:scale(1.14);filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #F58A1F) drop-shadow(0 0 9px rgba(245,138,31,.7));box-shadow:none;outline:0;position:relative;z-index:1}
.onb .card{max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);overflow-y:auto;overscroll-behavior:contain;padding:16px 18px}
.onb input{margin:3px 0 8px;padding:9px 12px}
.row .mi.av{background:radial-gradient(circle at 32% 24%,#fff,var(--ah,#FFE3AE) 70%);border-radius:50%;box-shadow:0 0 0 3px #fff,0 3px 0 3px var(--ah2,#E6C98F)}
.row .mi.av .avi{width:94%;height:94%;vertical-align:baseline}
.row .mi.av.art{background:none;box-shadow:none;border-radius:0;width:56px;height:56px;margin:-4px -4px -4px -2px}
.row .mi.av.art .avi{width:100%;height:100%}
#brand .av.art{width:30px;height:30px;margin:-2px 0 -2px -3px}
@media (max-height:700px){.avbig{width:72px;height:72px;font-size:40px;margin-bottom:0}.onb .card{padding:12px 16px}.onb .sug{display:none}.avname{margin-bottom:2px}}

/* ---------- Einzug der Figur (nach „Los geht’s!“): Bühne, Ebenen, Effekte, Namensband ---------- */
.avwrap{position:relative;width:fit-content;margin:0 auto}
.avplay{position:absolute;right:-12px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:linear-gradient(#8CEA7E,#2FB04A);box-shadow:0 3px 0 #1E7F34,0 0 0 2.5px #fff,inset 0 2px 0 rgba(255,255,255,.6)}
.avplay::before{content:"";position:absolute;left:12px;top:8px;border-left:10px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;filter:drop-shadow(0 1px 0 rgba(10,80,30,.7))}
.ent{position:fixed;inset:0;z-index:56;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;--s:240px;--h:240px;--cy:45%;--tt:60px;--rt:400px}
.ent.solo{background:radial-gradient(90% 70% at 50% 42%,rgba(112,40,80,.82),rgba(28,8,32,.95))}
.ent *{pointer-events:none}
.ent .rays{top:var(--cy);animation:none;opacity:0}
.ent-anchor{position:absolute;left:50%;top:var(--cy);width:0;height:0}
.ent-fxl{position:absolute;left:0;top:0;width:0;height:0}
.ent-fig{position:absolute;left:calc(var(--s) / -2);top:calc(var(--h) / -2);width:var(--s);height:var(--h);will-change:transform}
.ent-x,.ent-y,.ent-r{position:absolute;inset:0;will-change:transform}
.ent-y{transform-origin:50% 100%}
.ent-r{transform-origin:50% 55%}
.ent-img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none;filter:drop-shadow(0 8px 10px rgba(30,8,40,.4))}
.ent-img.disc{display:grid;place-items:center;border-radius:50%;font-size:calc(var(--s) * .55);filter:none;background:radial-gradient(circle at 32% 24%,#fff 0,var(--ah,#FFE3AE) 66%);box-shadow:0 0 0 6px #fff,0 8px 18px rgba(0,0,0,.3)}
.ent-sh{position:absolute;left:8%;right:8%;bottom:-5%;height:11%;border-radius:50%;background:radial-gradient(closest-side,rgba(15,3,25,.6),rgba(15,3,25,0));will-change:transform,opacity}
.ent-skates{position:absolute;left:13%;width:74%;bottom:-12%;height:17%}
.ent-trail{position:absolute;will-change:opacity}
.ent-trail.speed{left:58%;top:30%;width:100%;height:40%}
.ent-trail.speed i{position:absolute;left:0;height:6px;border-radius:99px;background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,0))}
.ent-trail.rainbow{left:52%;top:41%;width:112vw;height:calc(var(--s) * .27);border-radius:99px 0 0 99px;background:linear-gradient(#FF5B6B 0 16.6%,#FFA43C 0 33.3%,#FFE24D 0 50%,#5DD66A 0 66.6%,#4FB4FF 0 83.3%,#A06BFF 0);box-shadow:0 0 22px rgba(255,255,255,.6),inset 0 3px 0 rgba(255,255,255,.4)}
.ent-thr{position:absolute;left:0;right:0;bottom:-26%;height:34%;display:flex;justify-content:space-around;padding:0 20%;will-change:opacity}
.ent-thr i{width:26%;height:100%;border-radius:50% 50% 50% 50% / 24% 24% 76% 76%;background:linear-gradient(#FFF8C9,#FFC23D 40%,#FF6A1F 76%,rgba(255,60,20,0));transform-origin:50% 0}
.fx{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity}
img.fx{object-fit:contain}
.fx.puff{border-radius:50%;background:radial-gradient(circle at 40% 36%,#fff 0,#F6F0FF 40%,rgba(240,230,255,0) 71%)}
.fx.star{background:radial-gradient(circle,#fff 0,#FFF6C4 30%,#FFD24D 62%,#FFB300);clip-path:polygon(50% 0,59% 41%,100% 50%,59% 59%,50% 100%,41% 59%,0 50%,41% 41%)}
.fx.drop{border-radius:50% 50% 50% 50% / 70% 70% 30% 30%;background:radial-gradient(circle at 36% 62%,#fff 0,#BDEBFF 30%,#47AEF7 100%)}
.fx.flame{border-radius:50% 50% 50% 50% / 70% 70% 30% 30%;background:radial-gradient(ellipse at 50% 70%,#FFF9D0 0,#FFD84D 34%,#FF8A24 68%,rgba(255,70,20,0) 100%)}
.fx.leaf{border-radius:0 100% 0 100%;background:linear-gradient(135deg,#B6F07B,#2FA84A)}
.fx.ring{border-radius:50%;border:5px solid rgba(255,255,255,.9);box-shadow:0 0 14px rgba(255,255,255,.7),inset 0 0 14px rgba(255,255,255,.5)}
.fx.glow{border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(190,230,255,.45) 45%,rgba(255,255,255,0) 70%)}
.fx.excl{display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 28%,#FF9A8A,#E2402F);color:#fff;font-family:var(--num);line-height:1;box-shadow:0 0 0 3px #fff,0 4px 0 #A12414}
.ent-title,.ent-ribbon,.ent-skip{position:absolute;left:0;right:0;text-align:center;opacity:0}
.ent-title{top:var(--tt);color:#fff}
.ent-title small{display:block;font:400 clamp(18px,5.4vw,24px)/1.1 var(--num);color:#FFF1D6;text-shadow:0 2px 0 rgba(90,30,10,.75),0 6px 14px rgba(0,0,0,.35);letter-spacing:.5px}
.ent-title b{display:block;font:400 clamp(34px,11vw,50px)/1.1 var(--num);color:#FFE97A;-webkit-text-stroke:9px #7A2A10;paint-order:stroke fill;text-shadow:0 5px 0 #7A2A10,0 12px 22px rgba(0,0,0,.4);margin-top:2px;padding:0 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent-ribbon{top:var(--rt)}
.ent-ribbon b{display:inline-block;position:relative;font:400 clamp(24px,7.6vw,32px)/1 var(--num);color:#fff;padding:9px 26px 11px;border-radius:16px;background:linear-gradient(#FF8A78,#E2503F);box-shadow:0 5px 0 #A8321F,0 12px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(120,30,10,.8)}
.ent-ribbon b::before{content:"";position:absolute;left:10px;right:10px;top:4px;height:42%;border-radius:12px 12px 40px 40px / 12px 12px 20px 20px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0))}
.ent-ribbon small{display:block;margin:12px 14px 0;font:400 clamp(16px,4.8vw,20px)/1.2 var(--num);color:#FFF1D6;text-shadow:0 2px 0 rgba(90,30,10,.8),0 4px 12px rgba(0,0,0,.4)}
.ent-skip{bottom:calc(env(safe-area-inset-bottom) + 22px);font:400 14px var(--num);color:rgba(255,241,214,.85);text-shadow:0 1px 0 rgba(60,20,10,.8)}
@media (max-height:700px){.ent-title b{font-size:clamp(30px,9.6vw,42px);-webkit-text-stroke-width:8px}.ent-ribbon small{margin-top:8px}}

const Platform = {
  async init() {
    const P = Plug();
    try { if (P.AppsFlyer) await P.AppsFlyer.initSDK({ devKey: CONFIG.appsflyer.devKey, appID: CONFIG.appsflyer.iosAppId, isDebug: false, registerConversionListener: true, waitForATTUserAuthorization: 10 }); } catch (e) { console.warn('AppsFlyer init', e); }
    try { if (P.AdMob) await P.AdMob.initialize({}); } catch (e) { console.warn('AdMob init', e); }
    try { await this.consent(); } catch (e) {}
    this.preloadAd();
    try { if (P.Purchases) await P.Purchases.configure({ apiKey: osName() === 'ios' ? CONFIG.revenuecat.ios : CONFIG.revenuecat.android }); } catch (e) { console.warn('RevenueCat init', e); }
  },
  track(name, params = {}) {
    try {
      (window.__events = window.__events || []).push({ name, params, ts: Date.now() });
      const P = Plug();
      if (P.AppsFlyer) P.AppsFlyer.logEvent({ eventName: name, eventValue: params }).catch(()=>{});
      if (P.FirebaseAnalytics) P.FirebaseAnalytics.logEvent({ name, params }).catch(()=>{});
      if (typeof window.gtag === 'function') window.gtag('event', name, params);
    } catch (e) {}
  },
  adReady: false, adBusy: false,
  /* Einwilligung (Google UMP / DSGVO): ohne sie liefert AdMob in der EU kaum Werbung aus */
  async consent() {
    const P = Plug(); if (!P.AdMob || !P.AdMob.requestConsentInfo) return;
    try {
      const info = await P.AdMob.requestConsentInfo();
      if (info && info.isConsentFormAvailable && info.status === 'REQUIRED') await P.AdMob.showConsentForm();
    } catch (e) { console.warn('Consent', e); }
  },
  /* Nächstes Video schon im Hintergrund laden, damit der Tipp sofort wirkt */
  async preloadAd() {
    const P = Plug(); if (!P.AdMob || this.adReady || this.adBusy) return this.adReady;
    this.adBusy = true;
    try { await P.AdMob.prepareRewardVideoAd({ adId: osName() === 'ios' ? CONFIG.admob.rewardedIOS : CONFIG.admob.rewardedAndroid }); this.adReady = true; }
    catch (e) { this.adReady = false; }
    this.adBusy = false; return this.adReady;
  },
  async showRewarded() {
    const P = Plug();
    if (P.AdMob) {
      try {
        if (!this.adReady) { toast(t('adLoading')); await this.preloadAd(); }
        if (!this.adReady) return false;
        this.adReady = false;
        const r = await P.AdMob.showRewardVideoAd();
        setTimeout(() => this.preloadAd(), 800);
        return !!r;
      } catch (e) { this.adReady = false; setTimeout(() => this.preloadAd(), 4000); return false; }
    }
    return demoAd();
  },
  async purchase(sku) {
    const P = Plug();
    if (!P.Purchases) return null;
    try {
      const { products } = await P.Purchases.getProducts({ productIdentifiers: [sku] });
      if (!products || !products.length) return false;
      await P.Purchases.purchaseStoreProduct({ product: products[0] });
      return true;
    } catch (e) { return false; }
  }
};

function tickEnergy() {
  const now = Date.now(), m = maxEnergy();
  if (S.energy >= m) { S.eTs = now; return; }
  const g = Math.floor((now - S.eTs) / CONFIG.energyRegenMs);
  if (g > 0) { S.energy = Math.min(m, S.energy + g); S.eTs += g * CONFIG.energyRegenMs; if (S.energy >= m) S.eTs = now; save(); }
}

const Scenes = (() => {

  const f1 = n => (+n).toFixed(1);

  const at = (x, y, inner, s = 1) => `<g transform="translate(${f1(x)},${f1(y)}) scale(${s})">${inner}</g>`;
  const an = (c, inner, st = '') => `<g class="${c}" style="${st}">${inner}</g>`;

  const drift = (y, inner, dur, off, c = 'a-drift') => `<g transform="translate(0,${y})">${an(c, inner, `--dur:${dur}s;animation-delay:-${off}s`)}</g>`;
  const bird = (col = '#3b3b4f', s = 1) => `<g transform="scale(${s})">${an('a-flap', `<path d="M-9 0Q-4.5-6 0 0Q4.5-6 9 0" stroke="${col}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`)}</g>`;
  const gull = s => `<g transform="scale(${s})">${an('a-flap', `<path d="M-11 0Q-5-8 0 0Q5-8 11 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M-11 0Q-5-8 0 0Q5-8 11 0" stroke="#5a6470" stroke-width="1" fill="none"/>`)}</g>`;
  const tw = (R, a = 1.6, b = 3.5) => `--dur:${f1(a + R() * (b - a))}s;animation-delay:-${f1(R() * 4)}s`;
  const twink = (items, R, k = 3, a = 1.6, b = 4) => Array.from({ length: k }, (_, g) => `<g class="a-tw" style="${tw(R, a, b)}">${items.filter((_, j) => j % k === g).join('')}</g>`).join('');
  const gulls = (ys) => ys.map((y, i) => drift(y, gull(.8 + (i % 3) * .15), 26 + i * 7, i * 9, i % 2 ? 'a-drift-r' : 'a-drift')).join('');
  function lights(x0, y0, x1, y1, sag, n, cols, R, r = 4.5) {
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2 + sag * 2;
    let s = `<path d="M${x0} ${y0}Q${mx} ${my} ${x1} ${y1}" stroke="#4a3a30" stroke-width="1.5" fill="none" opacity=".7"/>`;
    for (let i = 1; i < n; i++) {
      const t = i / n, x = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * mx + t * t * x1, y = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * my + t * t * y1 + 5, c = cols[i % cols.length];
      s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r * 2.6}" fill="${c}" opacity=".18"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="${c}" class="a-tw" style="${tw(R)}"/>`;
    }

  }
  function fall(n, cols, R, kind = 'leaf') {
    let s = '';
    for (let i = 0; i < n; i++) {

      const sh = kind === 'leaf' ? `<ellipse rx="6" ry="3" fill="${c}"/>` : kind === 'petal' ? `<path d="M0-4Q4 0 0 4Q-4 0 0-4Z" fill="${c}"/>` : `<circle r="2" fill="${c}"/>`;
      s += `<g transform="translate(${f1(R() * 400)},0)">${an('a-fall', sh, `--dur:${f1(dur)}s;--dx:${Math.round(R() * 140 - 50)}px;animation-delay:-${f1(R() * dur)}s`)}</g>`;
    }
    return s;
  }
  const stars = (n, R, ymax, col = '#fff') => twink(Array.from({ length: n }, () => `<circle cx="${f1(R() * 400)}" cy="${f1(R() * ymax)}" r="${f1(.6 + R() * 1.6)}" fill="${col}"/>`), R, 4, 1.5, 5);

const Calm = (() => {
  let held = [], timer = 0, locked = false;
  const pauseAll = () => {
    try {
      for (const a of document.getAnimations()) {
        if (a.playState !== 'running' || !a.effect || a.effect.getTiming().iterations !== Infinity) continue;
        a.pause(); held.push(a);
      }
    } catch (_) {}
  };
  const wake = () => {
    if (locked) { pauseAll(); timer = setTimeout(wake, 600); return; }
    if (drag) { timer = setTimeout(wake, 500); return; }
    held.forEach(a => { try { if (a.playState === 'paused') a.play(); } catch (_) {} }); held = [];
  };
  const hush = (ms = 1500) => { pauseAll(); clearTimeout(timer); timer = setTimeout(wake, ms); };
  /* lock: unter Fenstern/Splash ruhen die Endlos-Animationen dauerhaft (Web-Animations-API statt CSS-Klasse auf body) */
  const lock = on => { locked = on; if (on) hush(600); else { clearTimeout(timer); timer = setTimeout(wake, 120); } };
  return { hush, wake, lock };
})();
