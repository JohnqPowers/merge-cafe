name: Android-Build

on:
  push:
    branches: [main]
    paths: ['www/**', 'capacitor.config.json', 'package.json', 'assets/**', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      track:
        description: 'Google-Play-Track (internal, alpha, beta, production)'
        default: internal

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      BUILD_NUMBER: ${{ github.run_number }}
      APPSFLYER_DEV_KEY: ${{ secrets.APPSFLYER_DEV_KEY }}
      REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
      REVENUECAT_TEST_KEY: ${{ secrets.REVENUECAT_TEST_KEY }}
      ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
      ADMOB_REWARDED_ANDROID: ${{ secrets.ADMOB_REWARDED_ANDROID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Android-SDK prüfen (auf dem GitHub-Server vorinstalliert)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Abhängigkeiten
        run: npm install
      - name: Schlüssel einsetzen
        run: node scripts/inject-config.js
      - name: AppsFlyer-Schnittstelle bündeln (www/af.js)
        run: node scripts/bundle-af.js
      - name: Eingesetzte Versionen festhalten
        run: |
          npm ls --all --omit=dev > npm-tree.txt || true
          { echo '### Eingesetzte Versionen (npm ls)'; echo '```'; npm ls --depth=0 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: versionen-${{ github.run_number }}
          path: npm-tree.txt
      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#C8553D" --iconBackgroundColorDark "#C8553D" --splashBackgroundColor "#F6EBDD" --splashBackgroundColorDark "#3B2A20"
          node scripts/patch-android.js
          npx cap sync android

      - name: Test-APK bauen (zum direkten Installieren)
        run: cd android && chmod +x gradlew && bash ../scripts/retry-net.sh ./gradlew assembleDebug   # wiederholt bei Netzwerkfehlern von Maven Central (HTTP 429), nicht bei Codefehlern
      - uses: actions/upload-artifact@v4
        with:
          name: noas-bean-trail-test-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Test-APK als direkten Download veröffentlichen
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk noas-bean-trail-test.apk
          gh release delete test-apk -y --cleanup-tag || true
          gh release create test-apk noas-bean-trail-test.apk --prerelease \
            --title "Test-APK (Build ${{ github.run_number }})" \
            --notes "Automatisch gebaut. Zum Testen direkt aufs Handy laden und installieren."

      - name: Store-Datei (.aab) signiert bauen
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          bash scripts/retry-net.sh npx cap build android \
            --keystorepath "$RUNNER_TEMP/release.jks" \
            --keystorepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --keystorealias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --keystorealiaspass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --androidreleasetype AAB
          ls -la android/app/build/outputs/bundle/release/
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: noas-bean-trail-store-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab

      - name: In Google Play hochladen
        if: env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.johnqpowers.beantrail
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
