name: Kennzahlen holen (AppsFlyer)

on:
  schedule:
    - cron: '17 4 * * *'   # täglich ca. 05:17 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kpi:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.APPSFLYER_API_TOKEN }}
      APP_ID: io.github.johnqpowers.mergecafe
    steps:
      - uses: actions/checkout@v4
      - name: Berichte der letzten 30 Tage laden
        if: env.TOKEN != ''
        run: |
          mkdir -p reports/appsflyer
          FROM=$(date -u -d '30 days ago' +%F); TO=$(date -u -d 'yesterday' +%F)
          for R in partners_by_date_report geo_by_date_report; do
            curl -sf -H "Authorization: Bearer $TOKEN" -H "accept: text/csv" \
              "https://hq1.appsflyer.com/api/agg-data/export/app/$APP_ID/$R/v5?from=$FROM&to=$TO" \
              -o "reports/appsflyer/$R.csv" || echo "WARN: $R fehlgeschlagen"
          done
          echo "$(date -u +%FT%TZ)" > reports/appsflyer/last_update.txt
      - name: Speichern
        if: env.TOKEN != ''
        run: |
          git config user.name "kpi-bot"; git config user.email "kpi-bot@users.noreply.github.com"
          git add reports/ && git commit -m "Kennzahlen $(date -u +%F)" && git push || echo "Keine Änderungen"
      - name: Hinweis
        if: env.TOKEN == ''
        run: echo "APPSFLYER_API_TOKEN fehlt noch – übersprungen."
